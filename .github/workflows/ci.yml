name: CI

on:
  push:
    branches: [main, fullstack]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qahub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # API integration tests create, migrate and seed this database themselves.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qahub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Builds the web app again and starts the e2e API (own database, fake Google).
      - run: npm run e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qahub_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
