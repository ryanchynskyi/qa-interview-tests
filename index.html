иши.<\/p><pre style=\"white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--sunk);padding:8px 10px;border-radius:6px;overflow-x:auto\">await page.click('#save');\nawait page.waitForTimeout(3000);\nconst visible = await page.locator('.toast').isVisible();\nexpect(visible).toBe(true);\nconst text = await page.locator('.toast').textContent();\nexpect(text).toContain('Saved');<\/pre>","ctx":"Кнопка: <button>Save<\/button>. Тост: <div role=\"status\">Saved successfully<\/div>","starter":"test('save shows toast', async ({ page }) => {\n  await page.goto('/profile');\n  // перепиши тест\n});","hints":["isVisible() не чекає, повертає стан тут і зараз.","waitForTimeout маскує проблему й сповільнює.","expect(locator) з web-first матчером замість expect(значення)."],"checks":[["без waitForTimeout","^(?![\\s\\S]*waitForTimeout)",""],["без isVisible()","^(?![\\s\\S]*isVisible\\(\\))",""],["без textContent()","^(?![\\s\\S]*textContent\\(\\))",""],["await expect(locator).toBeVisible або toContainText","await\\s+expect\\([^)]*\\)\\)?\\.(toBeVisible|toContainText|toHaveText)",""],["user-facing локатор для кнопки","getByRole\\(\\s*['\"]button['\"]",""]],"sol":"test('save shows toast', async ({ page }) => {\n  await page.goto('/profile');\n  await page.getByRole('button', { name: 'Save' }).click();\n\n  const toast = page.getByRole('status');\n  await expect(toast).toBeVisible();\n  await expect(toast).toContainText('Saved');\n});","say":"Три проблеми. waitForTimeout: або чекаємо задовго, або замало. isVisible і textContent знімають одноразовий знімок, тому без ретраю. CSS-селектори прив'язані до верстки. Web-first асерт чекає саме потрібну умову і падає з зрозумілим повідомленням."},{"id":6,"topic":"Взаємодія","lvl":"junior","min":5,"title":"Select, checkbox, radio","task":"<p>У налаштуваннях переказу: обрати валюту <code>EUR<\/code> у випадаючому списку, увімкнути чекбокс «Save as template», обрати радіокнопку «Express». Перевір, що всі три стани застосовано.<\/p>","ctx":"<select aria-label=\"Currency\"> ... <input type=\"checkbox\" aria-label=\"Save as template\"> <input type=\"radio\" name=\"speed\" aria-label=\"Express\">","starter":"test('configure transfer options', async ({ page }) => {\n  await page.goto('/transfer');\n  // твій код\n});","hints":["selectOption для <select>.","check() ідемпотентний, на відміну від click().","toHaveValue, toBeChecked."],"checks":[["selectOption","selectOption\\(",""],["check()","\\.check\\(\\)",""],["toHaveValue","toHaveValue\\(",""],["toBeChecked","toBeChecked\\(",""]],"sol":"test('configure transfer options', async ({ page }) => {\n  await page.goto('/transfer');\n\n  await page.getByLabel('Currency').selectOption('EUR');\n  await page.getByLabel('Save as template').check();\n  await page.getByRole('radio', { name: 'Express' }).check();\n\n  await expect(page.getByLabel('Currency')).toHaveValue('EUR');\n  await expect(page.getByLabel('Save as template')).toBeChecked();\n  await expect(page.getByRole('radio', { name: 'Express' })).toBeChecked();\n});","say":"check замість click, бо click на вже увімкнений чекбокс вимкне його, а check доводить до потрібного стану і сам перевіряє, що стан змінився."},{"id":7,"topic":"Мережа","lvl":"middle","min":7,"title":"Мок відповіді API","task":"<p>Сторінка рахунків бере дані з <code>GET /api/accounts<\/code>. Підмін відповідь: один рахунок <code>{ id: 1, iban: \"PL61109010140000071219812874\", balance: 1250.5, currency: \"PLN\" }<\/code>. Перевір, що на сторінці видно баланс <code>1 250,50 zł<\/code>.<\/p>","ctx":"","starter":"test('shows mocked balance', async ({ page }) => {\n  // твій код\n});","hints":["page.route треба зареєструвати ДО goto.","route.fulfill({ json: ... }) сам виставить content-type.","Glob: '**/api/accounts'."],"checks":[["page.route","page\\.route\\(",""],["route.fulfill","\\.fulfill\\(",""],["route оголошено до goto","page\\.route\\([\\s\\S]*page\\.goto\\(",""],["перевірка тексту балансу","toContainText|toHaveText|getByText",""]],"sol":"test('shows mocked balance', async ({ page }) => {\n  await page.route('**/api/accounts', route =>\n    route.fulfill({\n      status: 200,\n      json: [{ id: 1, iban: 'PL61109010140000071219812874', balance: 1250.5, currency: 'PLN' }],\n    }),\n  );\n\n  await page.goto('/accounts');\n  await expect(page.getByText('1 250,50 zł')).toBeVisible();\n});","say":"Роут реєструю до навігації, інакше запит піде раніше за перехоплення. Мок ізолює UI від бекенду і стабільних даних, але такий тест не доводить, що бекенд працює, тому поруч має бути API-тест на сам ендпоінт."},{"id":8,"topic":"Мережа","lvl":"middle","min":5,"title":"Помилка сервера в UI","task":"<p>Змусь <code>POST /api/transfers<\/code> повернути <code>500<\/code>. Заповни суму 100, натисни «Send» і перевір, що користувач бачить «Transfer failed. Try again», а кнопка знову активна.<\/p>","ctx":"<input aria-label=\"Amount\"> <button>Send<\/button> <div role=\"alert\">...<\/div>","starter":"test('handles 500 on transfer', async ({ page }) => {\n  // твій код\n});","hints":["Фільтруй метод: route.request().method().","Для інших методів route.continue() або fallback().","toBeEnabled."],"checks":[["page.route на transfers","route\\(\\s*['\"][^'\"]*transfers",""],["status 500","status:\\s*500",""],["перевірка методу POST","method\\(\\)\\s*={2,3}\\s*['\"]POST['\"]|['\"]POST['\"]\\s*={2,3}",""],["continue/fallback для інших","\\.(continue|fallback)\\(",""],["toBeEnabled","toBeEnabled\\(",""]],"sol":"test('handles 500 on transfer', async ({ page }) => {\n  await page.route('**/api/transfers', route => {\n    if (route.request().method() === 'POST') {\n      return route.fulfill({ status: 500, json: { error: 'Internal' } });\n    }\n    return route.continue();\n  });\n\n  await page.goto('/transfer');\n  await page.getByLabel('Amount').fill('100');\n  await page.getByRole('button', { name: 'Send' }).click();\n\n  await expect(page.getByRole('alert')).toHaveText('Transfer failed. Try again');\n  await expect(page.getByRole('button', { name: 'Send' })).toBeEnabled();\n});","say":"Помилки сервера важко відтворити на стенді, тому мокаю. Фільтрую саме POST, щоб не зламати GET на той самий шлях. Окремо перевіряю, що кнопка розблокувалась, бо типовий баг: після помилки форма залишається в стані loading."},{"id":9,"topic":"Мережа","lvl":"middle","min":6,"title":"Дочекатися реального запиту","task":"<p>Без моків: натисни «Send» і перевір, що фронт відправив <code>POST /api/transfers<\/code>, отримав <code>201<\/code>, а в тілі відповіді є <code>status: \"PENDING\"<\/code>.<\/p>","ctx":"","starter":"test('transfer request succeeds', async ({ page }) => {\n  await page.goto('/transfer');\n  await page.getByLabel('Amount').fill('100');\n  // твій код\n});","hints":["waitForResponse треба запустити ДО кліку, без await.","Предикат: url + method.","response.status(), await response.json()."],"checks":[["waitForResponse","waitForResponse\\(",""],["проміс створено до click","waitForResponse[\\s\\S]*\\.click\\(",""],["await відповіді після click","\\.click\\([\\s\\S]*await\\s+\\w+",""],["status 201","201",""],["response.json()","\\.json\\(\\)",""]],"sol":"test('transfer request succeeds', async ({ page }) => {\n  await page.goto('/transfer');\n  await page.getByLabel('Amount').fill('100');\n\n  const responsePromise = page.waitForResponse(r =>\n    r.url().includes('/api/transfers') && r.request().method() === 'POST',\n  );\n  await page.getByRole('button', { name: 'Send' }).click();\n  const response = await responsePromise;\n\n  expect(response.status()).toBe(201);\n  const body = await response.json();\n  expect(body.status).toBe('PENDING');\n});","say":"Проміс створюю до кліку, бо відповідь може прийти швидше, ніж я почну чекати, і тоді тест висить до таймауту. Тут expect без await нормальний: це звичайне значення, не локатор."},{"id":10,"topic":"API","lvl":"middle","min":7,"title":"API-тест через request","task":"<p>Без браузера: створи користувача <code>POST /api/users<\/code> з тілом <code>{ name, email }<\/code>, перевір <code>201<\/code> і що відповідь містить <code>id<\/code> та той самий email. Потім <code>GET /api/users/:id<\/code> має повернути 200 з тим самим email.<\/p>","ctx":"baseURL задано в конфігу.","starter":"import { test, expect } from '@playwright/test';\n\ntest('create and read user', async ({ request }) => {\n  // твій код\n});","hints":["Фікстура request, не page.","data: {...} серіалізується в JSON.","Унікальний email через Date.now()."],"checks":[["request.post","request\\.post\\(",""],["data:","data:\\s*\\{",""],["перевірка 201","201",""],["request.get","request\\.get\\(",""],["унікальні дані","Date\\.now\\(\\)|randomUUID|faker",""],["toMatchObject або перевірка email","toMatchObject|\\.email\\)\\.toBe",""]],"sol":"import { test, expect } from '@playwright/test';\n\ntest('create and read user', async ({ request }) => {\n  const email = 'qa+' + Date.now() + '@bank.test';\n\n  const created = await request.post('/api/users', { data: { name: 'QA', email } });\n  expect(created.status()).toBe(201);\n  const user = await created.json();\n  expect(user).toMatchObject({ id: expect.any(Number), email });\n\n  const fetched = await request.get('/api/users/' + user.id);\n  expect(fetched.ok()).toBeTruthy();\n  expect((await fetched.json()).email).toBe(email);\n});","say":"Фікстура request не запускає браузер, тому такі тести швидкі. Email унікальний, бо при паралельному запуску чи повторі фіксовані дані дають конфлікт 409. toMatchObject з expect.any перевіряє контракт, не прив'язуючись до конкретного id."},{"id":11,"topic":"API","lvl":"middle","min":7,"title":"Підготовка через API, перевірка в UI","task":"<p>Створи бенефіціара через <code>POST /api/beneficiaries<\/code>, потім відкрий <code>/beneficiaries<\/code> і перевір, що він у списку. Після тесту видали його через API навіть якщо тест упав.<\/p>","ctx":"","starter":"test('beneficiary created via API is visible', async ({ page, request }) => {\n  // твій код\n});","hints":["try/finally гарантує видалення.","Ще краще: фікстура з teardown (задача 12).","page і request в одному тесті ділять baseURL."],"checks":[["request.post","request\\.post\\(",""],["page.goto","page\\.goto\\(",""],["delete в cleanup","request\\.delete\\(",""],["finally або фікстура","finally|use\\(",""],["web-first перевірка в UI","await\\s+expect\\(",""]],"sol":"test('beneficiary created via API is visible', async ({ page, request }) => {\n  const name = 'Anna Nowak ' + Date.now();\n  const res = await request.post('/api/beneficiaries', {\n    data: { name, iban: 'PL61109010140000071219812874' },\n  });\n  expect(res.status()).toBe(201);\n  const { id } = await res.json();\n\n  try {\n    await page.goto('/beneficiaries');\n    await expect(page.getByRole('row').filter({ hasText: name })).toBeVisible();\n  } finally {\n    await request.delete('/api/beneficiaries/' + id);\n  }\n});","say":"Дані готую через API, бо це в рази швидше й стабільніше, ніж клікати форму, а UI перевіряю там, де саме він під тестом. Cleanup у finally, щоб упалий тест не залишав сміття на стенді."},{"id":12,"topic":"Фікстури","lvl":"middle","min":8,"title":"Кастомна фікстура з teardown","task":"<p>Зроби фікстуру <code>account<\/code>, яка перед тестом створює рахунок через API і віддає його в тест, а після тесту видаляє. Напиши тест, який її використовує.<\/p>","ctx":"POST /api/accounts -> { id, iban }. DELETE /api/accounts/:id","starter":"import { test as base, expect } from '@playwright/test';\n\ntype Account = { id: number; iban: string };\n\n// export const test = ...\n\n// test('...', async ({ page, account }) => {});","hints":["base.extend<{ account: Account }>({...}).","Сигнатура: async ({ request }, use) => {...}.","Усе після await use(...) це teardown."],"checks":[["base.extend","base\\.extend<",""],["тип фікстури в generic","extend<\\s*\\{\\s*account",""],["await use(","await\\s+use\\(",""],["teardown після use","await\\s+use\\([\\s\\S]*delete",""],["тест використовує account","\\{\\s*[^}]*account[^}]*\\}\\s*\\)\\s*=>",""]],"sol":"import { test as base, expect } from '@playwright/test';\n\ntype Account = { id: number; iban: string };\n\nexport const test = base.extend<{ account: Account }>({\n  account: async ({ request }, use) => {\n    const res = await request.post('/api/accounts', { data: { currency: 'PLN' } });\n    expect(res.ok()).toBeTruthy();\n    const account: Account = await res.json();\n\n    await use(account);\n\n    await request.delete('/api/accounts/' + account.id);\n  },\n});\n\ntest('new account is listed', async ({ page, account }) => {\n  await page.goto('/accounts');\n  await expect(page.getByText(account.iban)).toBeVisible();\n});","say":"Фікстура це механізм підготовки середовища з гарантованим teardown, а не просто дані. Код до use виконується як setup, після use як teardown, навіть якщо тест упав. Вона лінива: якщо тест не просить account, рахунок не створюється."},{"id":13,"topic":"Архітектура","lvl":"middle","min":8,"title":"Page Object для логіну","task":"<p>Створи клас <code>LoginPage<\/code>: локатори як readonly-поля в конструкторі, методи <code>goto()<\/code> і <code>login(email, password)<\/code>. Асерти тримай у тесті, не в Page Object. Напиши тест.<\/p>","ctx":"","starter":"import { type Page, type Locator, test, expect } from '@playwright/test';\n\nexport class LoginPage {\n  // твій код\n}\n\ntest('login via page object', async ({ page }) => {\n  // твій код\n});","hints":["readonly email: Locator; ... у конструкторі this.email = page.getByLabel(...).","Локатор лінивий, тому створювати його в конструкторі безпечно.","Метод повертає Promise<void>."],"checks":[["readonly Locator поля","readonly\\s+\\w+\\s*:\\s*Locator",""],["constructor(page: Page) або readonly page","constructor\\(\\s*(private\\s+|public\\s+|readonly\\s+)*(readonly\\s+)?page\\s*:\\s*Page",""],["async login(","async\\s+login\\(",""],["async goto(","async\\s+goto\\(",""],["new LoginPage(page)","new\\s+LoginPage\\(\\s*page\\s*\\)",""],["асерт у тесті","test\\([\\s\\S]*await\\s+expect\\(",""]],"sol":"import { type Page, type Locator, test, expect } from '@playwright/test';\n\nexport class LoginPage {\n  readonly email: Locator;\n  readonly password: Locator;\n  readonly submit: Locator;\n\n  constructor(private readonly page: Page) {\n    this.email = page.getByLabel('Email');\n    this.password = page.getByLabel('Password');\n    this.submit = page.getByRole('button', { name: 'Sign in' });\n  }\n\n  async goto(): Promise<void> {\n    await this.page.goto('/login');\n  }\n\n  async login(email: string, password: string): Promise<void> {\n    await this.email.fill(email);\n    await this.password.fill(password);\n    await this.submit.click();\n  }\n}\n\ntest('login via page object', async ({ page }) => {\n  const loginPage = new LoginPage(page);\n  await loginPage.goto();\n  await loginPage.login('qa@bank.test', 'S3cret!');\n  await expect(page).toHaveURL(/\\/dashboard/);\n});","say":"Локатори створюю в конструкторі: це безпечно, бо локатор лише описує, як знайти елемент, і шукає його в момент дії. Асерти в тесті, щоб Page Object лишався перевикористовуваним і було видно, що саме тест перевіряє. Наступний крок: віддавати LoginPage через фікстуру, а не робити new в кожному тесті."},{"id":14,"topic":"Авторизація","lvl":"middle","min":8,"title":"Логін один раз через storageState","task":"<p>Напиши <code>auth.setup.ts<\/code>, який логіниться і зберігає стан у <code>playwright/.auth/user.json<\/code>, і фрагмент конфігу: проєкт <code>setup<\/code> та проєкт <code>chromium<\/code>, що залежить від нього й використовує збережений стан.<\/p>","ctx":"","starter":"// auth.setup.ts\nimport { test as setup, expect } from '@playwright/test';\n\n// playwright.config.ts (фрагмент projects)\n","hints":["page.context().storageState({ path }).","projects: [{ name: 'setup', testMatch: /.*\\.setup\\.ts/ }, ...].","dependencies: ['setup'], use: { storageState: ... }."],"checks":[["storageState({ path","storageState\\(\\s*\\{\\s*path",""],["перевірка, що логін вдався","await\\s+expect\\(",""],["проєкт setup з testMatch","testMatch",""],["dependencies","dependencies:\\s*\\[\\s*['\"]setup['\"]",""],["use.storageState у проєкті","storageState:\\s*['\"]",""]],"sol":"// auth.setup.ts\nimport { test as setup, expect } from '@playwright/test';\n\nconst authFile = 'playwright/.auth/user.json';\n\nsetup('authenticate', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Email').fill(process.env.QA_USER!);\n  await page.getByLabel('Password').fill(process.env.QA_PASSWORD!);\n  await page.getByRole('button', { name: 'Sign in' }).click();\n  await expect(page).toHaveURL(/\\/dashboard/);\n\n  await page.context().storageState({ path: authFile });\n});\n\n// playwright.config.ts\nprojects: [\n  { name: 'setup', testMatch: /.*\\.setup\\.ts/ },\n  {\n    name: 'chromium',\n    use: { ...devices['Desktop Chrome'], storageState: 'playwright/.auth/user.json' },\n    dependencies: ['setup'],\n  },\n],","say":"Логін через UI один раз, далі кожен тест стартує з готовими cookies і localStorage. Перед збереженням чекаю на dashboard, інакше можна зберегти стан до того, як сервер видав сесію. Файл .auth у .gitignore, креди з env, не з коду."},{"id":15,"topic":"Взаємодія","lvl":"middle","min":5,"title":"Нова вкладка","task":"<p>Клік по посиланню «Terms» відкриває документ у новій вкладці. Перевір, що в новій вкладці URL містить <code>/terms<\/code> і є заголовок «Terms of Service».<\/p>","ctx":"<a href=\"/terms\" target=\"_blank\">Terms<\/a>","starter":"test('terms open in new tab', async ({ page }) => {\n  await page.goto('/signup');\n  // твій код\n});","hints":["page.waitForEvent('popup') або context.waitForEvent('page').","Знову: проміс до кліку.","Нова вкладка теж Page з усім тим самим API."],"checks":[["waitForEvent popup або page","waitForEvent\\(\\s*['\"](popup|page)['\"]",""],["проміс до кліку","waitForEvent[\\s\\S]*\\.click\\(",""],["toHaveURL на новій вкладці","toHaveURL",""],["heading","getByRole\\(\\s*['\"]heading['\"]",""]],"sol":"test('terms open in new tab', async ({ page }) => {\n  await page.goto('/signup');\n\n  const popupPromise = page.waitForEvent('popup');\n  await page.getByRole('link', { name: 'Terms' }).click();\n  const terms = await popupPromise;\n\n  await expect(terms).toHaveURL(/\\/terms/);\n  await expect(terms.getByRole('heading', { name: 'Terms of Service' })).toBeVisible();\n});","say":"Нова вкладка відкривається в тому самому контексті, тому має ту саму сесію. Підписуюсь на подію до кліку, щоб не пропустити її."},{"id":16,"topic":"Взаємодія","lvl":"junior","min":4,"title":"Нативний confirm-діалог","task":"<p>Кнопка «Close account» показує нативний <code>confirm()<\/code> з текстом «Are you sure?». Перевір текст діалогу, прийми його і переконайся, що з'явилось «Account closed».<\/p>","ctx":"","starter":"test('confirm closing account', async ({ page }) => {\n  await page.goto('/settings');\n  // твій код\n});","hints":["Обробник page.once('dialog', ...) реєструється до кліку.","dialog.message(), dialog.accept().","За замовчуванням Playwright сам відхиляє діалоги."],"checks":[["page.once або page.on dialog","page\\.(once|on)\\(\\s*['\"]dialog['\"]",""],["dialog.message()","\\.message\\(\\)",""],["dialog.accept()","\\.accept\\(\\)",""],["обробник до кліку","['\"]dialog['\"][\\s\\S]*\\.click\\(",""]],"sol":"test('confirm closing account', async ({ page }) => {\n  await page.goto('/settings');\n\n  page.once('dialog', async dialog => {\n    expect(dialog.message()).toBe('Are you sure?');\n    await dialog.accept();\n  });\n  await page.getByRole('button', { name: 'Close account' }).click();\n\n  await expect(page.getByText('Account closed')).toBeVisible();\n});","say":"Без обробника Playwright автоматично відхиляє діалог, і тест перевірить гілку Cancel замість потрібної. once, а не on, щоб обробник не спрацював на інших діалогах."},{"id":17,"topic":"Взаємодія","lvl":"middle","min":5,"title":"Iframe платіжного провайдера","task":"<p>Форма картки вбудована в iframe з <code>title=\"Secure payment\"<\/code>. Введи номер картки <code>4242 4242 4242 4242<\/code> у поле «Card number» всередині iframe і натисни «Pay» на основній сторінці.<\/p>","ctx":"<iframe title=\"Secure payment\" src=\"https://psp.test/form\">","starter":"test('pay with card in iframe', async ({ page }) => {\n  await page.goto('/checkout');\n  // твій код\n});","hints":["page.frameLocator(selector) або locator(...).contentFrame().","Далі всередині звичайні getBy*.","Кнопка Pay поза iframe."],"checks":[["frameLocator або contentFrame","frameLocator\\(|contentFrame\\(\\)",""],["fill у полі всередині фрейму","(frame\\w*|contentFrame\\(\\))[\\s\\S]*\\.fill\\(",""],["Pay на page","page\\.getByRole\\(\\s*['\"]button['\"][^)]*Pay",""]],"sol":"test('pay with card in iframe', async ({ page }) => {\n  await page.goto('/checkout');\n\n  const psp = page.frameLocator('iframe[title=\"Secure payment\"]');\n  await psp.getByLabel('Card number').fill('4242 4242 4242 4242');\n\n  await page.getByRole('button', { name: 'Pay' }).click();\n  await expect(page.getByText('Payment accepted')).toBeVisible();\n});","say":"frameLocator лінивий, як і звичайний локатор, і сам дочекається завантаження iframe. Новіший запис: page.locator('iframe').contentFrame()."},{"id":18,"topic":"Взаємодія","lvl":"middle","min":6,"title":"Завантаження й вивантаження файлу","task":"<p>1) Завантаж файл <code>fixtures/statement.csv<\/code> у поле «Import statement». 2) Натисни «Export PDF» і перевір, що завантажений файл називається <code>statement.pdf<\/code>.<\/p>","ctx":"<input type=\"file\" aria-label=\"Import statement\"> <button>Export PDF<\/button>","starter":"import path from 'path';\n\ntest('import and export statement', async ({ page }) => {\n  await page.goto('/statements');\n  // твій код\n});","hints":["setInputFiles на input type=file.","page.waitForEvent('download') до кліку.","download.suggestedFilename()."],"checks":[["setInputFiles","setInputFiles\\(",""],["waitForEvent download","waitForEvent\\(\\s*['\"]download['\"]",""],["suggestedFilename","suggestedFilename\\(\\)",""],["проміс до кліку","['\"]download['\"][\\s\\S]*\\.click\\(",""]],"sol":"import path from 'path';\n\ntest('import and export statement', async ({ page }) => {\n  await page.goto('/statements');\n\n  await page.getByLabel('Import statement')\n    .setInputFiles(path.join(__dirname, 'fixtures', 'statement.csv'));\n  await expect(page.getByText('statement.csv uploaded')).toBeVisible();\n\n  const downloadPromise = page.waitForEvent('download');\n  await page.getByRole('button', { name: 'Export PDF' }).click();\n  const download = await downloadPromise;\n\n  expect(download.suggestedFilename()).toBe('statement.pdf');\n  await download.saveAs(test.info().outputPath('statement.pdf'));\n});","say":"setInputFiles обходить системний діалог вибору файлу. Для download та сама схема: проміс до кліку. Файл зберігаю в outputPath тесту, щоб паралельні воркери не перезаписували один одного."},{"id":19,"topic":"Структура","lvl":"middle","min":6,"title":"Параметризований тест","task":"<p>Перевір валідацію суми переказу на наборі даних: <code>0<\/code> → «Amount must be greater than 0», <code>-5<\/code> → те саме, <code>abc<\/code> → «Enter a valid number», <code>1000001<\/code> → «Limit exceeded». Кожен випадок має бути окремим тестом з унікальною назвою.<\/p>","ctx":"","starter":"const cases = [\n  // твої дані\n];\n\n// цикл з test(...)","hints":["for (const c of cases) { test(...) }.","Назва тесту обов'язково містить вхідне значення.","Без template literal можна склеїти рядки через +."],"checks":[["масив даних","const\\s+\\w+\\s*=\\s*\\[[\\s\\S]*\\{",""],["цикл навколо test","for\\s*\\(\\s*const[\\s\\S]*test\\(",""],["назва з параметром","test\\(\\s*('[^']*'\\s*\\+|\"[^\"]*\"\\s*\\+|`[^`]*\\$\\{)",""],["перевірка повідомлення","toHaveText|toContainText",""]],"sol":"const cases = [\n  { amount: '0', error: 'Amount must be greater than 0' },\n  { amount: '-5', error: 'Amount must be greater than 0' },\n  { amount: 'abc', error: 'Enter a valid number' },\n  { amount: '1000001', error: 'Limit exceeded' },\n];\n\nfor (const { amount, error } of cases) {\n  test('amount \"' + amount + '\" shows: ' + error, async ({ page }) => {\n    await page.goto('/transfer');\n    await page.getByLabel('Amount').fill(amount);\n    await page.getByRole('button', { name: 'Send' }).click();\n    await expect(page.getByRole('alert')).toHaveText(error);\n  });\n}","say":"Кожен кейс окремий тест, тому падіння одного не ховає решту, і вони паралеляться. Унікальна назва обов'язкова: Playwright впаде на дублікатах. Граничні значення беру з вимог: 0, від'ємне, нечислове, ліміт плюс один."},{"id":20,"topic":"Структура","lvl":"junior","min":5,"title":"describe, beforeEach, test.step","task":"<p>Згрупуй тести профілю в <code>describe<\/code>, у <code>beforeEach<\/code> відкривай <code>/profile<\/code>. Напиши один тест зміни телефону, розбитий на кроки <code>test.step<\/code>: «Edit phone», «Save», «Verify».<\/p>","ctx":"","starter":"test.describe('Profile', () => {\n  // твій код\n});","hints":["test.beforeEach(async ({ page }) => ...).","await test.step('назва', async () => {...}).","Кроки видно в репорті й трейсі."],"checks":[["test.describe","test\\.describe\\(",""],["test.beforeEach","test\\.beforeEach\\(",""],["мінімум три test.step","(test\\.step\\([\\s\\S]*){3}",""],["await перед test.step","await\\s+test\\.step\\(",""]],"sol":"test.describe('Profile', () => {\n  test.beforeEach(async ({ page }) => {\n    await page.goto('/profile');\n  });\n\n  test('user can change phone', async ({ page }) => {\n    await test.step('Edit phone', async () => {\n      await page.getByRole('button', { name: 'Edit' }).click();\n      await page.getByLabel('Phone').fill('+48 600 100 200');\n    });\n    await test.step('Save', async () => {\n      await page.getByRole('button', { name: 'Save' }).click();\n    });\n    await test.step('Verify', async () => {\n      await expect(page.getByLabel('Phone')).toHaveValue('+48 600 100 200');\n    });\n  });\n});","say":"test.step дає читабельний репорт і трейс з людськими назвами кроків. Це той самий ефект, що Given/When/Then у playwright-bdd, але без шару Gherkin."},{"id":21,"topic":"Bug hunt","lvl":"junior","min":4,"title":"Забуті await","task":"<p>Тест іноді зелений, хоча фіча зламана. Знайди проблеми:<\/p><pre style=\"white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--sunk);padding:8px 10px;border-radius:6px;overflow-x:auto\">test('delete card', async ({ page }) => {\n  page.goto('/cards');\n  page.getByRole('button', { name: 'Delete' }).click();\n  expect(page.getByText('Card deleted')).toBeVisible();\n});<\/pre>","ctx":"","starter":"test('delete card', async ({ page }) => {\n  // виправлений код\n});","hints":["Кожна дія і кожен web-first expect повертають Promise.","Без await expect тест завершиться до перевірки.","ESLint правило @typescript-eslint/no-floating-promises ловить це автоматично."],"checks":[["await page.goto","await\\s+page\\.goto",""],["await перед click","await\\s+page[\\s\\S]*\\.click\\(",""],["await expect","await\\s+expect\\(",""]],"sol":"test('delete card', async ({ page }) => {\n  await page.goto('/cards');\n  await page.getByRole('button', { name: 'Delete' }).click();\n  await expect(page.getByText('Card deleted')).toBeVisible();\n});","say":"Без await expect повертає проміс, який ніхто не чекає, тест закінчується зеленим до перевірки. Це хибно-позитивний тест, гірший за відсутній. У проєкті вмикаю no-floating-promises в ESLint, щоб це не залежало від уважності."},{"id":22,"topic":"Bug hunt","lvl":"senior","min":6,"title":"Спільний стан між тестами","task":"<p>Локально все зелене, у CI з <code>fullyParallel: true<\/code> тести падають. Чому і як виправити?<\/p><pre style=\"white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--sunk);padding:8px 10px;border-radius:6px;overflow-x:auto\">let orderId: string;\n\ntest('create order', async ({ request }) => {\n  const res = await request.post('/api/orders', { data: { amount: 10 } });\n  orderId = (await res.json()).id;\n});\n\ntest('cancel order', async ({ request }) => {\n  const res = await request.post('/api/orders/' + orderId + '/cancel');\n  expect(res.status()).toBe(200);\n});<\/pre>","ctx":"","starter":"// перепиши так, щоб кожен тест був незалежним\n","hints":["Різні тести можуть потрапити в різні воркери, а це різні процеси.","Порядок тестів не гарантований.","Кожен тест сам готує свої дані, або фікстура."],"checks":[["немає let на рівні модуля","^(?![\\s\\S]*^let\\s+\\w+\\s*:)","m"],["дані готує фікстура або сам cancel-тест","extend<|cancel[\\s\\S]*request\\.post\\(\\s*['\"]\\/api\\/orders['\"]",""],["cancel-тест не залежить від порядку","extend<|cancel['\"][\\s\\S]*request\\.post\\(\\s*['\"]\\/api\\/orders['\"]",""]],"sol":"import { test as base, expect } from '@playwright/test';\n\nconst test = base.extend<{ orderId: string }>({\n  orderId: async ({ request }, use) => {\n    const res = await request.post('/api/orders', { data: { amount: 10 } });\n    expect(res.status()).toBe(201);\n    await use((await res.json()).id);\n  },\n});\n\ntest('create order', async ({ orderId }) => {\n  expect(orderId).toBeTruthy();\n});\n\ntest('cancel order', async ({ request, orderId }) => {\n  const res = await request.post('/api/orders/' + orderId + '/cancel');\n  expect(res.status()).toBe(200);\n});","say":"Змінна модуля живе в одному воркері. При fullyParallel тести йдуть у різних процесах, і в другому orderId undefined. Плюс порядок не гарантований. Правило: тест не залежить від інших тестів, дані готує фікстура. describe.configure({ mode: 'serial' }) лише маскує проблему."},{"id":23,"topic":"Асерти","lvl":"middle","min":5,"title":"Soft assertions для форми профілю","task":"<p>На сторінці профілю перевір одразу всі поля: ім'я «Anna Nowak», email «anna@bank.test», країна «Poland», статус KYC «Verified». Якщо одне поле неправильне, тест має показати всі розбіжності, а не лише першу.<\/p>","ctx":"","starter":"test('profile data is correct', async ({ page }) => {\n  await page.goto('/profile');\n  // твій код\n});","hints":["expect.soft не зупиняє тест.","Тест однаково буде failed наприкінці.","Для полів вводу toHaveValue, для тексту toHaveText."],"checks":[["expect.soft","expect\\.soft\\(",""],["мінімум чотири soft-перевірки","(expect\\.soft\\([\\s\\S]*){4}",""],["await перед expect.soft","await\\s+expect\\.soft",""]],"sol":"test('profile data is correct', async ({ page }) => {\n  await page.goto('/profile');\n\n  await expect.soft(page.getByLabel('Full name')).toHaveValue('Anna Nowak');\n  await expect.soft(page.getByLabel('Email')).toHaveValue('anna@bank.test');\n  await expect.soft(page.getByLabel('Country')).toHaveValue('Poland');\n  await expect.soft(page.getByTestId('kyc-status')).toHaveText('Verified');\n});","say":"Soft-асерти корисні, коли перевірки незалежні: за один прогін бачу всі розбіжності. Для кроків, від яких залежить наступна дія, лишаю звичайний expect, бо продовжувати після провалу немає сенсу."},{"id":24,"topic":"Асерти","lvl":"senior","min":6,"title":"Асинхронна обробка: expect.poll","task":"<p>Після <code>POST /api/transfers<\/code> статус переказу змінюється у фоні: <code>PENDING<\/code> → <code>COMPLETED<\/code> за 2-10 секунд. Напиши перевірку, що статус через API стане <code>COMPLETED<\/code>, з таймаутом 15 секунд і без sleep.<\/p>","ctx":"GET /api/transfers/:id -> { id, status }","starter":"test('transfer completes', async ({ request }) => {\n  const res = await request.post('/api/transfers', { data: { amount: 10, to: 'PL61...' } });\n  const { id } = await res.json();\n  // твій код\n});","hints":["expect.poll(async () => значення, { timeout }).toBe(...).","Альтернатива: expect(async () => {...}).toPass().","intervals задає паузи між спробами."],"checks":[["expect.poll або toPass","expect\\.poll\\(|toPass\\(",""],["timeout","timeout:\\s*\\d+",""],["без waitForTimeout і setTimeout","^(?![\\s\\S]*(waitForTimeout|setTimeout))",""],["await","await\\s+expect",""]],"sol":"test('transfer completes', async ({ request }) => {\n  const res = await request.post('/api/transfers', { data: { amount: 10, to: 'PL61109010140000071219812874' } });\n  expect(res.status()).toBe(201);\n  const { id } = await res.json();\n\n  await expect.poll(async () => {\n    const r = await request.get('/api/transfers/' + id);\n    return (await r.json()).status;\n  }, { timeout: 15_000, intervals: [1_000, 2_000, 3_000] }).toBe('COMPLETED');\n});","say":"expect.poll повторює функцію, поки значення не відповідатиме матчеру, і робить з будь-якої асинхронної перевірки retrying-асерт. Для фінтех-обробки, черг і вебхуків це основний інструмент замість sleep."},{"id":25,"topic":"Конфіг","lvl":"middle","min":7,"title":"playwright.config.ts для CI","task":"<p>Напиши конфіг: тести в <code>./tests<\/code>, baseURL з env з дефолтом <code>http://localhost:3000<\/code>, у CI 2 ретраї та 2 воркери, локально без ретраїв, трейс на першому ретраї, скріншот лише при падінні, репортери html і junit, проєкти chromium і firefox, автоматичний запуск <code>npm run start<\/code>.<\/p>","ctx":"","starter":"import { defineConfig, devices } from '@playwright/test';\n\nexport default defineConfig({\n  // твій код\n});","hints":["process.env.CI ? 2 : 0.","trace: 'on-first-retry', screenshot: 'only-on-failure'.","webServer: { command, url, reuseExistingServer: !process.env.CI }."],"checks":[["testDir","testDir:",""],["retries залежить від CI","retries:\\s*process\\.env\\.CI",""],["workers у CI","workers:\\s*process\\.env\\.CI",""],["trace on-first-retry","on-first-retry",""],["screenshot only-on-failure","only-on-failure",""],["junit reporter","junit",""],["два проєкти","(name:\\s*['\"][\\s\\S]*){2}",""],["webServer","webServer:",""]],"sol":"import { defineConfig, devices } from '@playwright/test';\n\nexport default defineConfig({\n  testDir: './tests',\n  fullyParallel: true,\n  forbidOnly: !!process.env.CI,\n  retries: process.env.CI ? 2 : 0,\n  workers: process.env.CI ? 2 : undefined,\n  reporter: [['html', { open: 'never' }], ['junit', { outputFile: 'results/junit.xml' }]],\n  use: {\n    baseURL: process.env.BASE_URL ?? 'http://localhost:3000',\n    trace: 'on-first-retry',\n    screenshot: 'only-on-failure',\n  },\n  projects: [\n    { name: 'chromium', use: { ...devices['Desktop Chrome'] } },\n    { name: 'firefox', use: { ...devices['Desktop Firefox'] } },\n  ],\n  webServer: {\n    command: 'npm run start',\n    url: 'http://localhost:3000',\n    reuseExistingServer: !process.env.CI,\n  },\n});","say":"Ретраї тільки в CI, щоб локально flaky-тести не ховались. Трейс на першому ретраї дає повний запис саме того прогону, що впав, без витрат на зелені тести. forbidOnly не дасть закомітити test.only."},{"id":26,"topic":"Фінтех","lvl":"senior","min":8,"title":"Перевірка суми й балансу після переказу","task":"<p>Баланс до переказу <code>1 250,50 zł<\/code>. Переказ <code>0,10 zł<\/code> двічі. Перевір, що баланс став рівно <code>1 250,30 zł<\/code>. Обчислення роби так, щоб не впасти на <code>0.1 + 0.2<\/code>, і не хардкодь очікуваний рядок, а виведи його з початкового балансу.<\/p>","ctx":"<span data-testid=\"balance\">1 250,50 zł<\/span>  (пробіл тисяч може бути нерозривним U+00A0)","starter":"function toMinor(text: string): number {\n  // \"1 250,50 zł\" -> 125050\n}\n\ntest('balance decreases by exact amount', async ({ page }) => {\n  await page.goto('/accounts/1');\n  // твій код\n});","hints":["Рахуй у грошах мінорних одиниць (гроші, копійки) як цілі числа.","Нормалізуй пробіли: replace(/\\s/g, '').","Для форматування очікуваного значення Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' })."],"checks":[["функція парсингу в мінорні одиниці","function\\s+toMinor[\\s\\S]*return",""],["цілочисельна арифметика (* 100 або Math.round)","\\*\\s*100|Math\\.round|parseInt",""],["нормалізація пробілів","replace\\(\\s*\\/\\\\s|\\\\u00a0|\\\\u202f","i"],["Intl.NumberFormat або toHaveText з обчисленим значенням","Intl\\.NumberFormat|toHaveText\\(\\s*(expected|format)",""],["web-first асерт на баланс","await\\s+expect\\([^)]*balance","i"]],"sol":"function toMinor(text: string): number {\n  const digits = text.replace(/\\s/g, '').replace('zł', '').replace(',', '.');\n  return Math.round(Number(digits) * 100);\n}\n\nfunction formatPln(minor: number): string {\n  return new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' })\n    .format(minor / 100);\n}\n\ntest('balance decreases by exact amount', async ({ page }) => {\n  await page.goto('/accounts/1');\n  const balance = page.getByTestId('balance');\n  const before = toMinor(await balance.innerText());\n\n  for (let i = 0; i < 2; i++) {\n    await page.getByLabel('Amount').fill('0,10');\n    await page.getByRole('button', { name: 'Send' }).click();\n    await expect(page.getByRole('status')).toContainText('Transfer sent');\n  }\n\n  const expected = formatPln(before - 10 - 10);\n  await expect(balance).toHaveText(expected.replace(/\\s/g, ' ').trim(), { useInnerText: true });\n});","say":"Гроші рахую в мінорних одиницях як цілі числа, бо 0.1 + 0.2 у JS дає 0.30000000000000004. Очікуване значення виводжу з початкового, щоб тест не залежав від стану рахунку. Нерозривні пробіли в pl-PL форматі дають класичний flaky на порівнянні рядків, тому нормалізую. На реальному проєкті ще перевірив би це через API, а не тільки текст на екрані."}],"manual":[{"t":"API","l":"junior","q":"Які HTTP-методи ідемпотентні за специфікацією?","o":["GET, PUT, DELETE (а також HEAD, OPTIONS)","GET і POST","Лише GET","POST, PUT, PATCH"],"e":"Ідемпотентний означає, що повтор того самого запиту не змінює результат після першого виконання. POST не ідемпотентний: два однакові POST створять два ресурси. PATCH ідемпотентний не гарантовано."},{"t":"API","l":"junior","q":"Чим 401 відрізняється від 403?","o":["401: сервер не знає, хто ти (немає або невалідний токен). 403: знає, але прав немає","401: немає прав, 403: немає токена","Це синоніми","401 для GET, 403 для POST"],"e":"401 Unauthorized фактично означає «не автентифікований». 403 Forbidden означає «автентифікований, але доступ заборонено». Перевіряй обидва сценарії окремо."},{"t":"API","l":"junior","q":"Який статус очікується після успішного POST, що створив ресурс?","o":["201 Created, часто із заголовком Location або id у тілі","200 OK завжди","204 No Content","202 Accepted завжди"],"e":"201 показує, що ресурс створено. 202 доречний, коли обробка асинхронна, наприклад переказ у статусі PENDING. 204 означає успіх без тіла."},{"t":"API","l":"middle","q":"Чим PUT відрізняється від PATCH?","o":["PUT замінює ресурс повністю, PATCH змінює лише передані поля","PUT створює, PATCH видаляє","PATCH ідемпотентний завжди, PUT ніколи","Нічим, це синоніми"],"e":"Тест-кейс: PUT без одного поля. За стандартом поле має обнулитися або повернутися помилка валідації. Якщо поведінка як у PATCH, це відхилення від контракту, яке варто зафіксувати."},{"t":"API","l":"junior","q":"Запит GET /users/42?active=true. Що тут path-параметр, а що query?","o":["42 це path-параметр, active=true це query-параметр","Обидва path","Обидва query","42 це query, active це path"],"e":"Path ідентифікує ресурс, query фільтрує, сортує чи пагінує. Невалідний path часто дає 404, невалідний query зазвичай 400."},{"t":"API","l":"middle","q":"На невалідне тіло запиту API повертає 500. Це баг?","o":["Так. Помилка клієнта має давати 4xx з описом, 500 означає необроблений виняток на сервері","Ні, 500 підходить для будь-якої помилки","Ні, якщо в тілі є текст помилки","Лише якщо це GET"],"e":"500 на некоректний ввід означає, що сервер не валідує дані і падає. Очікувано 400 або 422 з повідомленням, яке поле не так."},{"t":"API","l":"middle","q":"Відповідь 200 OK з тілом {\"error\": \"Insufficient funds\"}. Як оцінити?","o":["Це дефект контракту: помилка має мати відповідний 4xx-статус, бо клієнти й моніторинг орієнтуються на код","Нормально, головне що є текст","Нормально для фінтеху","Баг лише в UI"],"e":"Клієнт, ретраї, алерти й логи дивляться на статус. 200 з помилкою в тілі ховає збої. Для недостатніх коштів доречні 422 або 409 за домовленістю."},{"t":"API","l":"middle","q":"Користувач A запитує GET /orders/123, яке належить користувачу B, і отримує дані. Що це?","o":["IDOR (Broken Object Level Authorization), критичний дефект безпеки","Нормальна поведінка, якщо A залогінений","Помилка продуктивності","Баг кешування"],"e":"Сервер перевірив автентифікацію, але не власника ресурсу. Очікувано 403 або 404. Перевірка: два користувачі, обмін id між ними."},{"t":"API","l":"middle","q":"Навіщо в платіжних API заголовок Idempotency-Key?","o":["Щоб повтор того самого запиту (ретрай після таймауту) не створив другий платіж","Для авторизації","Для кешування відповіді браузером","Для шифрування тіла"],"e":"Тест: два однакові POST з одним ключем повинні дати одну операцію, і другий отримає ту саму відповідь. Той самий ключ з іншим тілом має дати помилку."},{"t":"API","l":"middle","q":"Чим Content-Type відрізняється від Accept?","o":["Content-Type описує формат тіла, яке надсилається, Accept каже, який формат клієнт хоче отримати","Це синоніми","Accept для запиту, Content-Type лише для відповіді","Content-Type задає кодування токена"],"e":"Негативні кейси: неправильний Content-Type (очікувано 415 Unsupported Media Type) і непідтримуваний Accept (406 Not Acceptable)."},{"t":"API","l":"middle","q":"Реєстрація з email, який уже існує. Який статус найлогічніший?","o":["409 Conflict","404 Not Found","500 Internal Server Error","200 OK"],"e":"409 означає конфлікт зі станом ресурсу. Деякі команди повертають 400 або 422, головне щоб це було в контракті й не було 2xx чи 5xx."},{"t":"API","l":"middle","q":"Що означає статус 429?","o":["Too Many Requests: спрацював rate limit, часто з заголовком Retry-After","Таймаут сервера","Запит занадто великий","Потрібна оплата"],"e":"Для логіну й OTP rate limit є вимогою безпеки. Перевір, що ліміт спрацьовує, і що після паузи доступ відновлюється."},{"t":"API","l":"senior","q":"Змінна baseUrl задана в Environment і в Collection з різними значеннями. Яке візьме Postman?","o":["Environment: вужча область перекриває ширшу (Local > Data > Environment > Collection > Global)","Collection, бо вона ближча до запиту","Global завжди","Першу створену"],"e":"Пріоритет від найвужчої області до найширшої. Через це «чужа» змінна в оточенні може тихо перекрити значення колекції."},{"t":"API","l":"junior","q":"Що означає, що HTTP stateless?","o":["Сервер не пам'ятає попередніх запитів; кожен запит несе все потрібне (токен, cookie)","Сервер не має бази даних","Відповіді не можна кешувати","Запити йдуть без заголовків"],"e":"Стан користувача живе в токені, cookie чи БД, а не в з'єднанні. Звідси тест-кейси на прострочений і відкликаний токен."},{"t":"API","l":"middle","q":"Що перевіряє JSON Schema валідація відповіді?","o":["Структуру: наявність полів, їхні типи, обов'язковість, допустимі значення","Конкретні значення бізнес-даних","Час відповіді","Статус-код"],"e":"Схема ловить зламаний контракт: поле зникло, тип змінився з number на string. Конкретні значення перевіряються окремими асертами."},{"t":"SQL","l":"junior","q":"Чим WHERE відрізняється від HAVING?","o":["WHERE фільтрує рядки до групування, HAVING фільтрує групи після GROUP BY","Це синоніми","HAVING працює лише з JOIN","WHERE не можна використовувати з GROUP BY"],"e":"Агрегати на кшталт COUNT(*) можна фільтрувати тільки в HAVING, бо на етапі WHERE групи ще не існують."},{"t":"SQL","l":"junior","q":"Що поверне INNER JOIN users і orders?","o":["Лише користувачів, які мають хоча б одне замовлення (по рядку на кожне замовлення)","Усіх користувачів","Усі замовлення, навіть без користувача","Лише по одному рядку на користувача"],"e":"INNER JOIN залишає пари, для яких умова з'єднання виконалась. Користувачі без замовлень випадають."},{"t":"SQL","l":"middle","q":"Як знайти користувачів без жодного замовлення?","c":"SELECT u.id, u.email\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE ???;","o":["o.id IS NULL","o.id = NULL","u.id IS NULL","o.user_id <> u.id"],"e":"LEFT JOIN залишає всіх користувачів, а для тих, у кого немає замовлень, колонки orders стають NULL. Порівняння = NULL ніколи не буває істинним."},{"t":"SQL","l":"junior","q":"Чим COUNT(*) відрізняється від COUNT(phone)?","o":["COUNT(*) рахує всі рядки, COUNT(phone) лише рядки, де phone не NULL","Нічим","COUNT(phone) рахує унікальні значення","COUNT(*) ігнорує NULL"],"e":"Унікальні значення рахує COUNT(DISTINCT phone). Різниця між COUNT(*) і COUNT(col) показує, скільки NULL у колонці."},{"t":"SQL","l":"middle","q":"Скільки рядків поверне запит, якщо в таблиці є рядки з deleted_at = NULL?","c":"SELECT * FROM users WHERE deleted_at = NULL;","o":["0: порівняння з NULL дає UNKNOWN, треба IS NULL","Усі рядки з NULL","Помилку синтаксису","Усі рядки таблиці"],"e":"NULL означає «невідомо», і будь-яке порівняння з ним через =, <> чи > дає UNKNOWN. Для перевірки є IS NULL та IS NOT NULL."},{"t":"SQL","l":"middle","q":"У якому порядку логічно виконується SELECT-запит?","o":["FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT","SELECT → FROM → WHERE → ORDER BY","WHERE → FROM → SELECT → GROUP BY","FROM → SELECT → WHERE → HAVING"],"e":"Тому аліас із SELECT не можна використати у WHERE (його ще немає), але можна в ORDER BY."},{"t":"SQL","l":"middle","q":"Як знайти email, що повторюються?","o":["SELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1","SELECT DISTINCT email FROM users","SELECT email FROM users WHERE COUNT(*) > 1","SELECT email FROM users ORDER BY email"],"e":"Класична задача на співбесіді. WHERE з агрегатом дасть помилку, групи фільтруються через HAVING."},{"t":"SQL","l":"junior","q":"Чим відрізняються DELETE, TRUNCATE і DROP?","o":["DELETE видаляє рядки (можна з WHERE), TRUNCATE очищає всю таблицю швидко, DROP видаляє таблицю разом зі структурою","Це синоніми","DROP видаляє лише рядки","TRUNCATE видаляє таблицю"],"e":"У PostgreSQL TRUNCATE теж можна відкотити в транзакції, але тригери ON DELETE він не викликає."},{"t":"SQL","l":"middle","q":"Чим UNION відрізняється від UNION ALL?","o":["UNION прибирає дублікати, UNION ALL залишає всі рядки й працює швидше","UNION ALL прибирає дублікати","UNION з'єднує колонки, UNION ALL рядки","Нічим"],"e":"Якщо дублікатів бути не може або вони потрібні, UNION ALL дешевший: немає сортування для дедуплікації."},{"t":"SQL","l":"senior","q":"Зарплати 100, 100, 90 за спаданням. Що дадуть ROW_NUMBER, RANK, DENSE_RANK?","o":["1,2,3 · 1,1,3 · 1,1,2","1,1,2 · 1,2,3 · 1,1,3","1,2,3 · 1,1,2 · 1,1,3","1,1,3 · 1,1,2 · 1,2,3"],"e":"ROW_NUMBER завжди унікальний. RANK дає однакові ранги й пропускає наступний номер. DENSE_RANK без пропусків, тому «друга найбільша зарплата» це DENSE_RANK = 2."},{"t":"SQL","l":"middle","q":"Переказ: списати з рахунку A і зарахувати на B. Яка властивість ACID гарантує, що не виконається лише половина?","o":["Atomicity (атомарність)","Consistency","Isolation","Durability"],"e":"Атомарність: або обидві зміни в транзакції, або жодна. Тест: зламати друге оновлення і перевірити, що баланс A не змінився."},{"t":"SQL","l":"junior","q":"Що таке foreign key?","o":["Колонка, що посилається на primary key іншої таблиці й не дає зберегти неіснуюче посилання","Унікальний ідентифікатор рядка","Індекс для швидкого пошуку","Колонка, що не може бути NULL"],"e":"Тест: вставити order з неіснуючим user_id, БД має відхилити. Видалення батьківського рядка залежить від ON DELETE (RESTRICT, CASCADE, SET NULL)."},{"t":"SQL","l":"middle","q":"Який тип колонки правильний для грошових сум?","o":["NUMERIC/DECIMAL з фіксованою точністю або ціле число в мінорних одиницях","FLOAT","REAL","VARCHAR"],"e":"FLOAT зберігає двійкове наближення: 0.1 + 0.2 не дорівнює 0.3. Для фінансових даних це дефект схеми, який варто піднімати."},{"t":"SQL","l":"senior","q":"Користувачі: A має 2 замовлення, B має 1, C не має жодного. Скільки рядків поверне users LEFT JOIN orders?","o":["4","3","2","5"],"e":"A дає 2 рядки, B один, C один з NULL замість замовлення. LEFT JOIN по зв'язку 1:N множить рядки, тому COUNT після JOIN без DISTINCT часто бреше."},{"t":"SQL","l":"middle","q":"Що поверне LIMIT 10 OFFSET 20?","o":["Рядки з 21-го по 30-й","Рядки з 20-го по 30-й","Рядки з 10-го по 20-й","Перші 30 рядків"],"e":"Без ORDER BY порядок не гарантований, і пагінація може дублювати чи губити рядки. Це типовий баг пагінації в API."},{"t":"STLC і теорія","l":"junior","q":"Правильний порядок фаз STLC?","o":["Аналіз вимог → Планування → Дизайн тест-кейсів → Підготовка середовища → Виконання → Закриття","Планування → Виконання → Аналіз вимог → Закриття","Дизайн тест-кейсів → Аналіз вимог → Виконання","Виконання → Планування → Звітність"],"e":"Підготовка середовища часто йде паралельно з дизайном кейсів. На закритті роблять звіт, метрики й ретроспективу."},{"t":"STLC і теорія","l":"junior","q":"Помилка в назві банку в шапці головної сторінки. Severity і priority?","o":["Low severity, high priority","High severity, low priority","High severity, high priority","Low severity, low priority"],"e":"Severity це вплив на систему (функціонал працює). Priority це терміновість для бізнесу (репутація, бренд). Протилежний приклад: рідкісний краш у забутому звіті, high severity і low priority."},{"t":"STLC і теорія","l":"junior","q":"Чим verification відрізняється від validation?","o":["Verification: чи правильно ми будуємо продукт (за специфікацією). Validation: чи будуємо ми правильний продукт (під потреби користувача)","Це синоніми","Verification це автотести, validation це мануальні","Validation робиться до написання коду"],"e":"Рев'ю вимог і коду це verification. UAT і перевірка реальних сценаріїв користувача це validation."},{"t":"STLC і теорія","l":"middle","q":"Поле «вік» приймає 18–60. Скільки тестів мінімально дає розбиття на класи еквівалентності для чисел?","o":["3: менше 18, від 18 до 60, більше 60","2: валідне й невалідне","4: межі 18 і 60 з обох боків","1: будь-яке валідне"],"e":"Один представник на клас. Окремо до цього додають нечислове, порожнє й дробове значення, а межі перевіряє boundary value analysis."},{"t":"STLC і теорія","l":"middle","q":"Значення для аналізу граничних значень (дві точки на межу) для діапазону 18–60?","o":["17, 18, 60, 61","18, 60","17, 61","0, 18, 60, 100"],"e":"Перевіряють межу і найближче значення по той бік. Трьохточковий варіант додає 19 і 59."},{"t":"STLC і теорія","l":"junior","q":"Чим smoke відрізняється від sanity?","o":["Smoke: широка поверхнева перевірка, що збірка придатна до тестування. Sanity: вузька перевірка конкретного виправлення чи зміни","Smoke це автотести, sanity мануальні","Sanity завжди довший за регресію","Нічим"],"e":"Smoke відповідає на питання «чи можна тестувати цю збірку взагалі». Sanity відповідає «чи логічно працює те, що змінили»."},{"t":"STLC і теорія","l":"junior","q":"Чим retesting відрізняється від regression testing?","o":["Retesting перевіряє, що конкретний баг виправлено. Regression перевіряє, що зміни не зламали те, що працювало","Це синоніми","Regression робиться лише перед релізом","Retesting автоматизують, regression ні"],"e":"Retesting йде за тими самими кроками з баг-репорту. Регресія охоплює суміжний і критичний функціонал."},{"t":"STLC і теорія","l":"middle","q":"Розробник позначив баг як Fixed, але на стенді він відтворюється. Що робить QA?","o":["Переводить баг у Reopened з коментарем: збірка, середовище, кроки, докази","Створює новий баг-репорт","Закриває баг, бо розробник його виправив","Чекає наступного релізу"],"e":"Спершу перевір, що на стенді саме та збірка, де є фікс. Якщо так, Reopened з доказами. Новий баг заводять, коли проблема інша, ніж в оригінальному репорті."},{"t":"STLC і теорія","l":"middle","q":"Що таке exit criteria?","o":["Умови завершення тестування: виконано заплановане покриття, немає відкритих critical і blocker багів, досягнуто погоджений pass rate","Список тестувальників, які виходять з проєкту","Умови початку тестування","Кількість знайдених багів"],"e":"Entry criteria це умови старту (готова збірка, середовище, вимоги). Без погоджених exit criteria рішення про реліз стає суперечкою."},{"t":"STLC і теорія","l":"middle","q":"Що описує «парадокс пестициду»?","o":["Ті самі тести, повторювані знову й знову, перестають знаходити нові дефекти","Що більше тестів, то більше багів","Автотести знищують мануальне тестування","Виправлення одного бага створює інший"],"e":"Рецепт: регулярно переглядати й оновлювати кейси, додавати нові дані, використовувати exploratory testing."},{"t":"STLC і теорія","l":"middle","q":"Коли доречна техніка таблиці рішень (decision table)?","o":["Коли результат залежить від комбінації кількох умов, наприклад знижка залежить від статусу клієнта, суми й промокоду","Для перевірки меж числового поля","Для тестування переходів між станами замовлення","Для навантажувального тестування"],"e":"Таблиця рішень гарантує, що не пропущено жодної комбінації умов. Для станів і переходів використовують state transition."},{"t":"STLC і теорія","l":"middle","q":"Переказ має статуси CREATED → PENDING → COMPLETED або FAILED. Яка техніка найкраще покриє недозволені переходи?","o":["State transition testing","Equivalence partitioning","Pairwise testing","Error guessing"],"e":"Будуєш діаграму станів, покриваєш усі дозволені переходи і перевіряєш недозволені: наприклад COMPLETED → PENDING має бути відхилено."},{"t":"STLC і теорія","l":"senior","q":"Що стверджує піраміда тестування?","o":["Багато швидких unit-тестів, менше інтеграційних, найменше дорогих E2E","Найбільше має бути E2E-тестів","Усі рівні мають однакову кількість тестів","Мануальне тестування в основі піраміди"],"e":"E2E повільні, крихкі й дорогі в підтримці, тому ними покривають критичні шляхи. Перевернута піраміда («ріжок морозива») це антипатерн."},{"t":"STLC і теорія","l":"middle","q":"Що означає shift-left?","o":["Залучати тестування якомога раніше: рев'ю вимог, участь у дизайні, тести разом з кодом","Переносити тестування на кінець спринту","Тестувати лише ліву частину UI","Переносити баги в наступний спринт"],"e":"Дефект, знайдений у вимогах, у рази дешевший за той самий дефект на продакшені."},{"t":"STLC і теорія","l":"junior","q":"Що НЕ потрібно в баг-репорті?","o":["Хто, на думку QA, винен у баґу","Кроки відтворення","Очікуваний і фактичний результат","Середовище, збірка, докази (скріншот, лог, HAR)"],"e":"Баг-репорт описує факти. Добрий заголовок відповідає на питання що, де й за яких умов зламалося."},{"t":"Docker","l":"junior","q":"Чим image відрізняється від container?","o":["Image це незмінний шаблон, container це запущений екземпляр image з власним станом","Це синоніми","Container це шаблон, image це запуск","Image працює лише в Linux"],"e":"З одного image можна запустити багато контейнерів. Аналогія: клас і об'єкт."},{"t":"Docker","l":"junior","q":"Чим docker ps відрізняється від docker ps -a?","o":["ps показує лише запущені контейнери, ps -a усі, включно із зупиненими","ps -a показує образи","Нічим","ps -a видаляє зупинені контейнери"],"e":"Якщо контейнер «зник», найчастіше він упав одразу після старту. Знайди його через ps -a і подивись docker logs."},{"t":"Docker","l":"junior","q":"Що означає -p 8080:80 у docker run?","o":["Порт 8080 хоста прокинуто на порт 80 контейнера","Порт 80 хоста на 8080 контейнера","Контейнер використовує обидва порти","Обмеження на 8080 процесів"],"e":"Формат host:container. До сервісу з браузера звертаєшся на localhost:8080."},{"t":"Docker","l":"middle","q":"Видалили контейнер PostgreSQL, і всі тестові дані зникли. Як цього уникнути?","o":["Зберігати дані у volume, який живе окремо від контейнера","Ніколи не зупиняти контейнер","Робити docker commit після кожного тесту","Запускати з -it"],"e":"Файлова система контейнера тимчасова. Іменований volume або bind mount переживає видалення контейнера."},{"t":"Docker","l":"middle","q":"Чим Dockerfile відрізняється від docker-compose.yml?","o":["Dockerfile описує, як зібрати один image. Compose описує, як запустити кілька сервісів разом: мережі, порти, volume, змінні","Це синоніми","Compose збирає образ, Dockerfile запускає","Dockerfile лише для Windows"],"e":"Типовий QA-сценарій: compose піднімає застосунок, БД і моки однією командою docker compose up."},{"t":"Docker","l":"junior","q":"Як подивитися, що вивів застосунок у контейнері?","o":["docker logs <container> (з -f для стрімінгу)","docker inspect <image>","docker ps --logs","docker images"],"e":"Перший крок при падінні контейнера або 500 від сервісу. Логи прикріплюй до баг-репорту."},{"t":"Docker","l":"middle","q":"Як виконати команду всередині запущеного контейнера, наприклад відкрити psql?","o":["docker exec -it <container> psql -U postgres","docker run -it <container> psql","docker attach psql","docker start psql"],"e":"exec запускає новий процес у вже працюючому контейнері. run створює новий контейнер з образу."},{"t":"Docker","l":"middle","q":"Чим контейнер принципово відрізняється від віртуальної машини?","o":["Контейнер ділить ядро ОС хоста й ізолює процеси, VM емулює повну ОС зі своїм ядром","Контейнер повільніший за VM","VM не має ізоляції","Контейнер завжди містить повну ОС"],"e":"Тому контейнери стартують за секунди й легші. Ціна: слабша ізоляція, ніж у VM."},{"t":"Docker","l":"middle","q":"У docker compose є сервіси app і db. Як app має звертатися до бази?","o":["За іменем сервісу як хостом: db:5432","localhost:5432","127.0.0.1:5432","За IP-адресою хоста"],"e":"Усередині контейнера localhost означає сам контейнер. Compose створює мережу, де ім'я сервісу резолвиться в його адресу. Класична причина «з тестів працює, з app ні»."},{"t":"Docker","l":"middle","q":"Помилка port is already allocated при старті контейнера. Що робити?","o":["Порт на хості вже зайнятий іншим процесом чи контейнером: звільнити його або змінити хостовий порт, наприклад -p 5433:5432","Перевстановити Docker","Змінити порт усередині контейнера","Запустити з sudo"],"e":"Перевір docker ps на старий контейнер. На Windows порт часто займає локально встановлений PostgreSQL."},{"t":"Docker","l":"junior","q":"Що робить прапорець -d у docker compose up -d?","o":["Запускає сервіси у фоні (detached) і повертає термінал","Видаляє контейнери після зупинки","Вмикає debug-режим","Завантажує образи без запуску"],"e":"Без -d логи всіх сервісів стримляться в термінал, а Ctrl+C зупиняє стек."},{"t":"Docker","l":"middle","q":"Чим docker compose down відрізняється від docker compose down -v?","o":["-v додатково видаляє volume, тобто всі дані бази","-v показує детальний лог","Нічим","-v лише зупиняє, не видаляючи"],"e":"Для чистого прогону тестів down -v корисний. Для збереження даних між сесіями небезпечний."},{"t":"Docker","l":"middle","q":"Головна користь Docker для QA?","o":["Відтворюване середовище: ті самі версії БД, сервісів і браузерів локально, у колег і в CI","Автоматичне написання тестів","Заміна тестових стендів продакшеном","Прискорення роботи UI"],"e":"Аргумент «у мене працює» зникає, коли всі запускають один і той самий образ. Офіційний Docker-образ Playwright містить потрібні браузери та системні залежності."},{"t":"Docker","l":"senior","q":"Чому в Dockerfile спочатку копіюють package.json, роблять npm ci, і лише потім COPY решти коду?","o":["Через кеш шарів: залежності перевстановлюються лише при зміні package.json, а не при кожній зміні коду","Так вимагає синтаксис Dockerfile","Щоб зменшити кількість контейнерів","Щоб npm працював без мережі"],"e":"Кожна інструкція створює шар. Якщо шар не змінився, Docker бере його з кешу, тож порядок інструкцій прямо впливає на швидкість збірки в CI."},{"t":"Docker","l":"senior","q":"docker run postgres одразу завершується. Найімовірніша причина?","o":["Не задано обов'язкову змінну POSTGRES_PASSWORD, і в docker logs буде про це повідомлення","Немає прапорця -it","Postgres не працює в Docker","Не вказано порт"],"e":"Офіційний образ вимагає пароль або явний POSTGRES_HOST_AUTH_METHOD. Правильно: docker run -e POSTGRES_PASSWORD=secret -p 5432:5432 -d postgres:16."}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const SECTIONS=[
  {id:'playwright',name:'Playwright',kind:'quiz',desc:'Квіз'},
  {id:'cypress',name:'Cypress',kind:'quiz',desc:'Квіз'},
  {id:'typescript',name:'TypeScript',kind:'quiz',desc:'Квіз'},
  {id:'manual',name:'Manual QA',kind:'quiz',desc:'API, SQL, STLC, Docker'},
  {id:'live',name:'Live coding',kind:'live',desc:'Playwright + TS'}
];
const KEY='qa-hub-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S={cur:'playwright',q:{},live:{status:{},code:{},cur:0,topic:'Усі'}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
SECTIONS.filter(s=>s.kind==='quiz').forEach(s=>{S.q[s.id]=S.q[s.id]||{hist:{},attempts:[]}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let qs={}; // per-section transient quiz state
let timerId=null;

/* ---------- tabs ---------- */
function sectionStat(sec){
  const n=D[sec.id].length;
  if(sec.kind==='quiz'){const h=S.q[sec.id].hist;const v=Object.values(h);return {n,y:v.filter(x=>x===1).length,b:v.filter(x=>x===0).length,p:0,label:v.filter(x=>x===1).length+' з '+n+' правильно'};}
  const v=Object.values(S.live.status);return {n,y:v.filter(x=>x==='done').length,p:v.filter(x=>x==='partial').length,b:v.filter(x=>x==='fail').length,label:v.filter(x=>x==='done').length+' з '+n+' зараховано'};
}
function renderTabs(){
  $('tabs').innerHTML=SECTIONS.map(s=>{const st=sectionStat(s);const w=k=>(st[k]/st.n*100)+'%';
    return '<button class="tab" role="tab" aria-selected="'+(S.cur===s.id)+'" data-id="'+s.id+'"><small>'+s.desc+' · '+st.n+'</small><b>'+s.name+'</b><small>'+st.label+'</small><span class="mini"><span style="width:'+w('y')+';background:var(--ok)"></span><span style="width:'+w('p')+';background:var(--warn)"></span><span style="width:'+w('b')+';background:var(--bad)"></span></span></button>';}).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>openSection(b.dataset.id));
}
function openSection(id){
  if(!SECTIONS.some(s=>s.id===id)) id='playwright';
  S.cur=id; save(); clearInterval(timerId);
  try{history.replaceState(null,'','#'+id)}catch(e){}
  renderTabs();
  const sec=SECTIONS.find(s=>s.id===id);
  if(sec.kind==='quiz'){ const st=qs[id]; if(st&&st.run&&st.run.i<st.run.items.length) showQ(id); else setup(id);} else live();
}

/* ---------- quiz ---------- */
function qState(id){return qs[id]=qs[id]||{l:'all',topics:null,count:10,run:null}}
function pool(id){const st=qState(id);const all=D[id];const topics=st.topics||new Set(all.map(x=>x.t));return all.map((x,i)=>i).filter(i=>(st.l==='all'||all[i].l===st.l)&&topics.has(all[i].t));}
function weak(id){const h=S.q[id].hist;return Object.keys(h).filter(k=>h[k]===0).map(Number);}
function setup(id){
  const st=qState(id), all=D[id];
  const topicList=[...new Set(all.map(x=>x.t))];
  if(!st.topics) st.topics=new Set(topicList);
  const n=pool(id).length, w=weak(id).length;
  const h=S.q[id].attempts.slice(0,5).map(a=>esc(a.d)+': '+a.y+' з '+a.n).join('<br>');
  $('view').innerHTML='<div class="card setup"><h2>'+SECTIONS.find(s=>s.id===id).name+': налаштування спроби</h2>'+
   '<div class="group" id="gL"><span>Рівень</span></div><div class="group" id="gT"><span>Теми</span></div><div class="group" id="gC"><span>Питань</span></div>'+
   '<div class="actions"><div class="left"><button class="btn primary" id="go" '+(n?'':'disabled')+'>Почати ('+Math.min(st.count||n,n)+')</button><button class="btn" id="weakBtn" '+(w?'':'disabled')+'>Слабкі місця ('+w+')</button></div></div>'+
   '<p class="note" style="margin-top:14px">Слабкі місця: питання, на які остання відповідь була неправильна або пропущена. Правильна відповідь прибирає питання зі списку.</p>'+
   (h?'<p class="note">Останні спроби:<br>'+h+'</p>':'')+'</div>';
  const chip=(el,label,pressed,fn)=>{const b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-pressed',pressed);b.onclick=fn;el.appendChild(b);};
  [['all','Усі'],['junior','junior'],['middle','middle'],['senior','senior']].forEach(([v,l])=>chip($('gL'),l,st.l===v,()=>{st.l=v;setup(id)}));
  chip($('gT'),'Усі теми',st.topics.size===topicList.length,()=>{st.topics=new Set(topicList);setup(id)});
  topicList.forEach(t=>chip($('gT'),t,st.topics.size!==topicList.length&&st.topics.has(t),()=>{if(st.topics.size===topicList.length) st.topics=new Set([t]); else {st.topics.has(t)?st.topics.delete(t):st.topics.add(t); if(!st.topics.size) st.topics=new Set(topicList);} setup(id)}));
  [[10,'10'],[20,'20'],[0,'Усі']].forEach(([v,l])=>chip($('gC'),l,st.count===v,()=>{st.count=v;setup(id)}));
  $('go').onclick=()=>{const p=shuffle(pool(id));start(id,st.count?p.slice(0,st.count):p)};
  $('weakBtn').onclick=()=>start(id,shuffle(weak(id)));
}
function start(id,items){qState(id).run={items,i:0,res:{},order:null,answered:false};showQ(id);}
function qbar(id){
  const r=qs[id].run,n=r.items.length,v=Object.values(r.res),c=k=>v.filter(x=>x===k).length,p=k=>(c(k)/n*100)+'%';
  return '<div class="top"><span>'+(r.i<n?'Питання '+(r.i+1)+' з '+n:'Завершено')+'</span><span>Правильно '+c('y')+' · Помилки '+c('n')+' · Пропущено '+c('s')+'</span></div><div class="bar"><span style="width:'+p('y')+';background:var(--ok)"></span><span style="width:'+p('n')+';background:var(--bad)"></span><span style="width:'+p('s')+';background:var(--warn)"></span></div>';
}
function showQ(id){
  const r=qs[id].run; if(r.i>=r.items.length) return results(id);
  const x=D[id][r.items[r.i]]; r.order=shuffle([0,1,2,3]); r.answered=false;
  $('view').innerHTML=qbar(id)+'<div class="card"><div class="meta"><span class="tag">'+esc(x.t)+'</span><span class="lvl">'+x.l+'</span></div><h2>'+esc(x.q)+'</h2>'+(x.c?'<pre><code>'+esc(x.c)+'</code></pre>':'')+
   '<div class="opts">'+r.order.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+(k+1)+'</b><span>'+esc(x.o[o])+'</span></button>').join('')+'</div><div id="ex"></div>'+
   '<div class="actions"><button class="btn ghost" id="skip">Пропустити</button><div class="left"><button class="btn" id="stop">Завершити спробу</button><button class="btn primary" id="next" hidden>Далі</button></div></div></div>';
  $('view').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(id,+b.dataset.k));
  $('skip').onclick=()=>answer(id,-1); $('next').onclick=()=>nextQ(id);
  $('stop').onclick=()=>{r.items=r.items.slice(0,r.i+(r.answered?1:0)); r.i=r.items.length; results(id);};
}
function answer(id,k){
  const r=qs[id].run; if(r.answered) return; r.answered=true;
  const qi=r.items[r.i], x=D[id][qi], btns=[...$('view').querySelectorAll('.opt')], rk=r.order.indexOf(0);
  btns.forEach(b=>b.disabled=true); btns[rk].classList.add('right');
  let v; if(k<0) v='s'; else if(k===rk) v='y'; else {v='n'; btns[k].classList.add('wrong');}
  r.res[qi]=v; S.q[id].hist[qi]=v==='y'?1:0; save();
  $('ex').innerHTML='<div class="ex"><div class="verdict '+v+'">'+{y:'Правильно',n:'Неправильно',s:'Пропущено'}[v]+'</div>'+esc(x.e)+'</div>';
  $('skip').hidden=true; $('next').hidden=false; $('next').focus({preventScroll:true});
  const top=$('view').querySelector('.top'); const tmp=document.createElement('div'); tmp.innerHTML=qbar(id); top.replaceWith(tmp.children[0]); $('view').querySelector('.bar').replaceWith(tmp.children[0]);
  renderTabs();
}
function nextQ(id){qs[id].run.i++; showQ(id); window.scrollTo({top:$('tabs').offsetTop,behavior:'smooth'});}
function results(id){
  const r=qs[id].run, n=r.items.length;
  if(!n){setup(id);return;}
  const ids=r.items, y=ids.filter(i=>r.res[i]==='y').length, pct=Math.round(y/n*100), by={};
  ids.forEach(i=>{const t=D[id][i].t;by[t]=by[t]||{y:0,a:0};by[t].a++;if(r.res[i]==='y')by[t].y++;});
  const rows=Object.entries(by).sort((a,b)=>a[1].y/a[1].a-b[1].y/b[1].a).map(([t,s])=>{const p=Math.round(s.y/s.a*100);return '<tr><td>'+esc(t)+'</td><td>'+s.y+' / '+s.a+'</td><td class="'+(p<70?'weak':'')+'">'+p+'%</td></tr>'}).join('');
  const missed=ids.filter(i=>r.res[i]!=='y');
  if(!r.saved){S.q[id].attempts.unshift({d:new Date().toLocaleString('uk-UA',{dateStyle:'short',timeStyle:'short'}),n,y});S.q[id].attempts=S.q[id].attempts.slice(0,20);r.saved=true;save();}
  const verdict=pct>=85?'Впевнений рівень. Далі переходь до коду, а не до повторних тестів.':pct>=65?'Середній рівень. Повторюй слабкі теми з таблиці, а не весь тест.':'Слабко для Senior. Пройди помилки, потім відкрий тему в гайді і напиши приклад руками.';
  $('view').innerHTML=qbar(id)+'<div class="card"><div class="meta"><span class="tag">Результат</span></div><div class="big">'+pct+'%</div><p>'+y+' правильних з '+n+'. '+verdict+'</p><div class="tw"><table><thead><tr><th>Тема</th><th>Правильно</th><th>%</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="actions"><div class="left"><button class="btn primary" id="redo" '+(missed.length?'':'disabled')+'>Пройти помилки й пропуски ще раз ('+missed.length+')</button><button class="btn" id="again">Нова спроба</button></div></div></div>';
  $('redo').onclick=()=>start(id,shuffle(missed)); $('again').onclick=()=>{qs[id].run=null;setup(id)};
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.target.tagName==='TEXTAREA') return;
  const sec=SECTIONS.find(s=>s.id===S.cur); if(sec.kind!=='quiz') return;
  const r=qs[S.cur]&&qs[S.cur].run; if(!r||r.i>=r.items.length) return;
  if(!r.answered){ if(/^[1-4]$/.test(e.key)) answer(S.cur,+e.key-1); else if('sS0?'.includes(e.key)&&e.key.length===1) answer(S.cur,-1); }
  else if(e.key==='Enter'){e.preventDefault(); nextQ(S.cur);}
});

/* ---------- live coding ---------- */
const T=D.live.map(t=>({...t,checks:t.checks.map(([l,s,f])=>[l,new RegExp(s,f)])}));
const L=S.live;
let hintN=0,t0=0;
const lvis=()=>T.filter(t=>L.topic==='Усі'||t.topic===L.topic);
const strip=c=>c.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:'"])\/\/.*$/gm,'$1');
function live(){
  const topics=['Усі',...new Set(T.map(t=>t.topic))];
  $('view').innerHTML='<div class="group" id="lf"><span>Тема</span></div><div class="map" id="map"></div>'+
   '<section class="task"><div class="card brief" id="brief"></div><div class="ed"><div class="edhead"><span class="timer" id="timer">00:00</span><span class="note" id="target"></span></div>'+
   '<textarea id="code" spellcheck="false" aria-label="Редактор коду"></textarea>'+
   '<div class="actions"><div class="left"><button class="btn primary" id="lcheck">Перевірити</button><button class="btn" id="lhint">Підказка</button><button class="btn" id="lshow">Показати рішення</button></div><button class="btn ghost" id="lreset">Скинути код</button></div>'+
   '<div class="card" id="checks" hidden></div><div class="card" id="sol" hidden></div></div></section>'+
   '<div class="nav"><button class="btn" id="lprev">Попередня</button><button class="btn" id="lnext">Наступна</button></div>';
  topics.forEach(tp=>{const b=document.createElement('button');b.className='chip';b.textContent=tp;b.setAttribute('aria-pressed',L.topic===tp);b.onclick=()=>{L.topic=tp;const v=lvis();if(!v.includes(T[L.cur]))L.cur=T.indexOf(v[0]);save();live();};$('lf').appendChild(b);});
  $('code').addEventListener('input',e=>{L.code[T[L.cur].id]=e.target.value;save();});
  $('code').addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();const ta=e.target,s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'));}});
  $('lcheck').onclick=lcheck; $('lhint').onclick=lhint; $('lshow').onclick=lshow;
  $('lreset').onclick=()=>{const t=T[L.cur];delete L.code[t.id];save();$('code').value=t.starter;};
  $('lprev').onclick=()=>lstep(-1); $('lnext').onclick=()=>lstep(1);
  lmap(); ltask();
}
function lmap(){
  $('map').innerHTML=lvis().map(t=>{const i=T.indexOf(t);return '<button class="dot '+(L.status[t.id]||'')+(i===L.cur?' cur':'')+'" data-i="'+i+'" title="'+esc(t.title)+'">'+t.id+'</button>'}).join('');
  $('map').querySelectorAll('.dot').forEach(b=>b.onclick=()=>lgo(+b.dataset.i));
}
function ltask(){
  const t=T[L.cur];
  $('brief').innerHTML='<div class="meta"><span class="tag">'+esc(t.topic)+'</span><span class="lvl">'+t.lvl+'</span><span>Задача '+t.id+' з '+T.length+'</span></div><h2>'+esc(t.title)+'</h2>'+t.task+(t.ctx?'<div class="ctx">Що є на сторінці:<pre>'+esc(t.ctx)+'</pre></div>':'')+'<div class="hints" id="hints"></div>';
  $('code').value=L.code[t.id]??t.starter; $('target').textContent='Ціль: '+t.min+' хв';
  $('checks').hidden=true; $('sol').hidden=true; hintN=0; $('lhint').textContent='Підказка ('+t.hints.length+')';
  t0=Date.now(); clearInterval(timerId);
  const upd=()=>{const el=$('timer'); if(!el){clearInterval(timerId);return;} const s=Math.floor((Date.now()-t0)/1000); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); el.classList.toggle('over',s>t.min*60);};
  upd(); timerId=setInterval(upd,1000);
}
function lgo(i){L.cur=i;save();lmap();ltask();window.scrollTo({top:$('tabs').offsetTop,behavior:'smooth'});}
function lstep(d){const v=lvis(),k=v.indexOf(T[L.cur]),n=v[k+d];if(n)lgo(T.indexOf(n));}
function lcheck(){
  const t=T[L.cur], c=strip($('code').value), neg=l=>/^(без|немає)/.test(l), anyPos=t.checks.some(([l,re])=>!neg(l)&&re.test(c));
  let ok=0; const rows=t.checks.map(([l,re])=>{const y=re.test(c)&&(anyPos||!neg(l)); if(y)ok++; return '<div class="ck '+(y?'y':'n')+'"><i>'+(y?'+':'−')+'</i><span>'+esc(l)+'</span></div>'}).join('');
  $('checks').innerHTML='<h3>Автоперевірка</h3>'+rows+'<p style="font-weight:600;margin:6px 0 4px">'+ok+' з '+t.checks.length+'</p><p class="note" style="margin:0">Шукає конструкції регулярками й не запускає код. Інший коректний підхід теж може бути правильним, звір з еталоном.</p>';
  $('checks').hidden=false;
}
function lhint(){const t=T[L.cur]; if(hintN>=t.hints.length)return; const d=document.createElement('div'); d.className='hint'; d.textContent=t.hints[hintN++]; $('hints').appendChild(d); $('lhint').textContent='Підказка ('+(t.hints.length-hintN)+')';}
function lshow(){
  const t=T[L.cur];
  $('sol').innerHTML='<h3>Еталонне рішення</h3><pre><code>'+esc(t.sol)+'</code></pre><h3>Як пояснити вголос</h3><p class="say">'+esc(t.say)+'</p><h3>Чесна самооцінка</h3><div class="actions grade" style="justify-content:flex-start"><button class="btn ok" data-g="done">Зарахувати</button><button class="btn pa" data-g="partial">Частково</button><button class="btn no" data-g="fail">Не вийшло</button></div>';
  $('sol').hidden=false;
  $('sol').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{L.status[t.id]=b.dataset.g;save();renderTabs();lmap();lstep(1);});
}

/* ---------- wipe ---------- */
let arm=false;
$('wipe').onclick=()=>{
  if(!arm){arm=true;$('wipe').textContent='Точно? Натисни ще раз';setTimeout(()=>{arm=false;$('wipe').textContent='Очистити прогрес цієї секції'},4000);return;}
  arm=false;$('wipe').textContent='Очистити прогрес цієї секції';
  if(S.cur==='live'){S.live=Object.assign(L,{status:{},code:{},cur:0,topic:'Усі'});} else {S.q[S.cur]={hist:{},attempts:[]};qs[S.cur]=null;}
  save(); openSection(S.cur);
};
const h=(location.hash||'').slice(1);
openSection(SECTIONS.some(s=>s.id===h)?h:S.cur);
</script>
