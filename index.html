<title>QA Interview Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: header + section tabs, below a single workspace: quiz setup -> question -> results, or the live-coding task view. */
:root{
  --bg:#f2f3f4; --surface:#ffffff; --sunk:#e6e8eb; --line:#d1d5db;
  --fg:#1b1f26; --muted:#5a6170; --accent:#2b5a7a; --accent-ink:#ffffff; --accent-soft:#dde8f0;
  --ok:#2e7d4f; --ok-soft:#dff1e5; --warn:#9c6510; --warn-soft:#f5e9d2; --bad:#b2392f; --bad-soft:#f7dfdb;
  --code-bg:#1c2129; --code-fg:#e2e7ee;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1a1e25; --sunk:#232831; --line:#333a45;
  --fg:#e3e6eb; --muted:#9aa2b0; --accent:#86b6d6; --accent-ink:#10181f; --accent-soft:#1f3343;
  --ok:#6cc790; --ok-soft:#1d3527; --warn:#e0a94f; --warn-soft:#3a2d16; --bad:#ec7b70; --bad-soft:#3d1f1c;
  --code-bg:#0e1116; --code-fg:#dde3ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1a1e25; --sunk:#232831; --line:#333a45;
  --fg:#e3e6eb; --muted:#9aa2b0; --accent:#86b6d6; --accent-ink:#10181f; --accent-soft:#1f3343;
  --ok:#6cc790; --ok-soft:#1d3527; --warn:#e0a94f; --warn-soft:#3a2d16; --bad:#ec7b70; --bad-soft:#3d1f1c;
  --code-bg:#0e1116; --code-fg:#dde3ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1{font:700 clamp(26px,4vw,36px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 16px;max-width:66ch}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:900px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tab{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--fg);font:inherit;display:grid;gap:2px}
.tab b{font:600 16px var(--display)}
.tab small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.tab .mini{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;display:flex;margin-top:6px}
.tab .mini span{height:100%}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.group > span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:80px;flex:none}
.chip{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.setup .actions{margin-top:14px}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;align-items:center}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 7px;font-weight:600}
.lvl{border:1px solid var(--line);border-radius:4px;padding:1px 7px}
h2{font:600 20px/1.35 var(--display);margin:0 0 12px;text-wrap:balance}
h3{font:600 13px var(--body);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
pre{background:var(--code-bg);color:var(--code-fg);font:13px/1.6 var(--mono);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 14px}
code{font:13px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
pre code{background:none;padding:0;color:inherit}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex;margin-bottom:14px}
.bar span{height:100%}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;font:15px/1.45 var(--body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{font:600 13px var(--mono);color:var(--muted);flex:none}
.opt span{min-width:0}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.ex{margin-top:14px;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.verdict{font-weight:600;margin-bottom:4px}
.verdict.y{color:var(--ok)} .verdict.n{color:var(--bad)} .verdict.s{color:var(--warn)}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .left{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px var(--body);border-radius:7px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-style:dashed;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.keys{font-size:12.5px;color:var(--muted);margin-top:12px}
.big{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;margin:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tw{overflow-x:auto;margin:14px 0}
.weak{color:var(--bad);font-weight:600}
.note{font-size:13px;color:var(--muted)}
/* live coding */
.map{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.dot{width:38px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 13px var(--mono);cursor:pointer}
.dot.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.partial{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dot.fail{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:2px}
.task{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:860px){.task{grid-template-columns:minmax(0,1fr)}}
.brief p{margin:0 0 10px} .brief ul{margin:0 0 10px;padding-left:20px}
.ctx{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
.ctx pre{white-space:pre-wrap;background:var(--sunk);color:var(--fg);font-size:12.5px;margin:6px 0 0}
.hints{margin-top:12px;display:grid;gap:6px}
.hint{font-size:14px;background:var(--warn-soft);border-radius:6px;padding:7px 10px}
.ed{display:grid;gap:10px;min-width:0}
.edhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.timer{font:500 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.timer.over{color:var(--bad)}
textarea{width:100%;min-height:340px;resize:vertical;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line);border-radius:10px;padding:14px;font:13.5px/1.6 var(--mono);tab-size:2;white-space:pre;overflow:auto}
.ck{display:flex;gap:8px;align-items:baseline;font-size:14px;padding:2px 0}
.ck i{font-style:normal;font-family:var(--mono);font-weight:600;width:16px;flex:none}
.ck.y i{color:var(--ok)} .ck.n i{color:var(--bad)}
.say{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 10px}
.grade .ok{border-color:var(--ok);color:var(--ok)} .grade .pa{border-color:var(--warn);color:var(--warn)} .grade .no{border-color:var(--bad);color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
footer{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.tab,.dot{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <h1>QA Interview Tests</h1>
  <p class="sub">Усі тести підготовки до співбесіди Senior QA Automation в одному місці. Чотири квізи з варіантами відповідей і тренажер live coding. Прогрес кожної секції зберігається окремо в цьому браузері.</p>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
  <footer>
    <span class="note">Клавіші в квізах: 1–4 відповідь, S або 0 пропуск, Enter далі.</span>
    <button class="btn ghost" id="wipe">Очистити прогрес цієї секції</button>
  </footer>
</div>

<script id="data" type="application/json">{"playwright":[{"t":"Архітектура","l":"junior","q":"Як Playwright керує браузером?","c":"","o":["Тести працюють у Node-процесі й надсилають команди браузеру через протокол по WebSocket: CDP для Chromium, власні протоколи для Firefox і WebKit","Через WebDriver, як Selenium","Код тесту виконується всередині сторінки, як у Cypress","Через розширення, встановлене в браузер"],"e":"Тест живе поза браузером і спілкується з ним через постійне з'єднання. Тому Playwright легко працює з кількома вкладками, контекстами й доменами, але доступ до DOM іде через протокол, а не напряму."},{"t":"Архітектура","l":"junior","q":"Які браузерні рушії підтримує Playwright?","c":"","o":["Chromium, Firefox і WebKit","Лише Chromium","Chromium і Firefox, без WebKit","Усі браузери через WebDriver"],"e":"WebKit — рушій Safari, тому Playwright дає змогу перевірити поведінку, близьку до Safari, навіть на Windows і Linux. Але це не той самий Safari, що в користувача на Mac чи iPhone."},{"t":"Архітектура","l":"middle","q":"Чим Playwright принципово відрізняється від Selenium?","c":"","o":["Немає WebDriver-посередника: пряме з'єднання з браузером, вбудовані auto-waiting, ізольовані контексти й перехоплення мережі","Playwright підтримує лише JavaScript, а Selenium — усі мови","Selenium швидший, бо працює без протоколу","Різниці немає, Playwright — обгортка над Selenium"],"e":"Playwright має офіційні клієнти для JS/TS, Python, Java і .NET. Ключова різниця — архітектура: одне постійне з'єднання замість HTTP-запиту на кожну команду і вбудоване очікування замість ручних explicit waits."},{"t":"Архітектура","l":"middle","q":"Чи є вбудований тест-ранер @playwright/test у всіх мовах?","c":"","o":["Ні: повний ранер з фікстурами, проєктами й шардингом — лише для JS/TS; для інших мов Playwright — бібліотека під pytest, JUnit, NUnit","Так, однаковий у всіх мовах","Лише для Python і JS","Ранера немає, завжди потрібен Jest або Mocha"],"e":"Тому питання про фікстури, projects і sharding зазвичай мають на увазі саме TypeScript/JavaScript-версію."},{"t":"Архітектура","l":"senior","q":"Мобільна емуляція через devices['iPhone 13'] — що це насправді?","c":"","o":["Емуляція: розмір вікна, user agent, touch, devicePixelRatio у десктопному рушії, а не реальний пристрій","Запуск на реальному iPhone через хмару","Запуск iOS-симулятора","Нативне тестування мобільного застосунку"],"e":"Емуляція добре ловить проблеми адаптивної верстки, але не замінює тестування на реальних пристроях: продуктивність, особливості мобільного Safari, клавіатура."},{"t":"Локатори","l":"junior","q":"Яким локаторам Playwright радить надавати перевагу?","c":"","o":["Орієнтованим на користувача: getByRole, getByLabel, getByText, getByTestId","XPath за повним шляхом від кореня","CSS-класам стилів","Індексам елементів через nth()"],"e":"Пріоритет — те, що бачить і з чим взаємодіє користувач: роль і доступне ім'я. Такі локатори стійкі до редизайну і заодно перевіряють доступність."},{"t":"Локатори","l":"junior","q":"Що таке Locator у Playwright?","c":"","o":["Лінивий опис того, як знайти елемент; пошук виконується заново щоразу, коли з ним щось роблять","Посилання на конкретний DOM-елемент, знайдений одразу","Promise, що розв'язується елементом","Масив знайдених елементів"],"e":"page.locator(...) нічого не шукає в момент створення. Тому локатор можна оголосити один раз (наприклад, у Page Object) і використовувати після будь-яких перемальовувань сторінки."},{"t":"Локатори","l":"middle","q":"Чим Locator відрізняється від ElementHandle?","c":"","o":["Locator перешукує елемент перед кожною дією і має auto-waiting; ElementHandle тримає конкретний вузол і може застаріти — його використовувати не рекомендують","Нічим, це синоніми","ElementHandle новіший і швидший","Locator працює лише з CSS, ElementHandle — з XPath"],"e":"ElementHandle — старий API. Якщо сторінка перемалювала вузол, handle вказує на від'єднаний елемент. Locator позбавлений цієї проблеми."},{"t":"Локатори","l":"middle","q":"На сторінці три кнопки «Видалити». Що станеться?","c":"await page.getByRole('button', { name: 'Видалити' }).click();","o":["Помилка strict mode violation: локатор знайшов кілька елементів","Клік по першій кнопці","Клік по всіх трьох кнопках","Клік по випадковій кнопці"],"e":"Дії вимагають, щоб локатор вказував рівно на один елемент. Звузити можна через filter, контейнер (row.getByRole(...)) або явно first()/nth(), якщо порядок справді важливий."},{"t":"Локатори","l":"middle","q":"Як клікнути «Видалити» саме в рядку з товаром «Термос»?","c":"","o":["page.getByRole('row').filter({ hasText: 'Термос' }).getByRole('button', { name: 'Видалити' })","page.getByRole('button', { name: 'Видалити' }).nth(2)","page.locator('text=Термос').click() і потім клік по кнопці","page.getByText('Термос Видалити')"],"e":"filter звужує набір рядків за текстом, а вкладений локатор шукає кнопку лише всередині знайденого рядка. Індекс nth(2) зламається, щойно зміниться порядок рядків."},{"t":"Локатори","l":"middle","q":"Який атрибут за замовчуванням шукає getByTestId?","c":"","o":["data-testid, але його можна змінити через testIdAttribute у конфігу","data-cy","data-test","id"],"e":"Якщо в проєкті вже прийнятий інший атрибут, наприклад data-qa, достатньо вказати use: { testIdAttribute: 'data-qa' }."},{"t":"Локатори","l":"senior","q":"Як працювати з елементом усередині iframe?","c":"","o":["Через page.frameLocator('#payment') або locator.contentFrame(), а далі звичайні локатори","Звичайним page.locator — Playwright шукає в iframe автоматично","Лише через page.evaluate","Ніяк, iframe не підтримується"],"e":"Платіжні форми часто живуть в iframe провайдера. Наприклад: page.frameLocator('#card-frame').getByLabel('Номер картки').fill(...)."},{"t":"Локатори","l":"senior","q":"Чи бачать CSS-локатори Playwright елементи в Shadow DOM?","c":"","o":["Так, CSS і getBy-локатори проходять крізь відкритий Shadow DOM; XPath — ні","Ні, потрібен спеціальний плагін","Лише в Chromium","Лише закритий Shadow DOM"],"e":"Тому з веб-компонентами в Playwright зазвичай не потрібні обхідні шляхи — на відміну від Cypress, де для цього є окрема опція includeShadowDom."},{"t":"Auto-waiting і асерти","l":"junior","q":"Що Playwright перевіряє перед click() (auto-waiting)?","c":"","o":["Елемент приєднаний до DOM, видимий, стабільний (не анімується), отримує події (не перекритий) і enabled","Лише те, що елемент існує в DOM","Що всі мережеві запити завершилися","Нічого, клікає одразу"],"e":"Поки умови не виконані, Playwright чекає до таймауту. { force: true } пропускає частину перевірок і може приховати реальний баг."},{"t":"Auto-waiting і асерти","l":"junior","q":"Який таймаут за замовчуванням у web-first асертів expect(locator)?","c":"","o":["5 секунд","30 секунд","1 секунда","Без обмежень"],"e":"Таймаут асертів — 5 секунд, таймаут усього тесту — 30 секунд. Для окремої перевірки: expect(locator).toBeVisible({ timeout: 10000 })."},{"t":"Auto-waiting і асерти","l":"middle","q":"Текст оновлюється через секунду після завантаження. Яка перевірка надійна?","c":"","o":["await expect(page.getByTestId('status')).toHaveText('Оплачено')","expect(await page.getByTestId('status').textContent()).toBe('Оплачено')","await page.waitForTimeout(1000), потім перевірка textContent","expect(page.getByTestId('status').innerText()).toBe('Оплачено')"],"e":"Web-first асерт ретраїться, доки текст не стане очікуваним. У другому варіанті textContent() читається один раз, і toBe перевіряє вже готовий рядок без повторів."},{"t":"Auto-waiting і асерти","l":"middle","q":"Що станеться, якщо забути await перед асертом?","c":"expect(page.getByText('Успіх')).toBeVisible();","o":["Перевірка не буде дочекана: тест може завершитися раніше і пройти, навіть якщо елемента немає","Playwright автоматично додасть await","Тест завжди впаде з помилкою синтаксису","Асерт виконається синхронно і миттєво"],"e":"Web-first асерти асинхронні. Від таких помилок рятує лінтер з правилом no-floating-promises — його варто ввімкнути в проєкті."},{"t":"Auto-waiting і асерти","l":"middle","q":"Як надійно перевірити, що в списку 10 товарів, які підвантажуються асинхронно?","c":"","o":["await expect(page.getByTestId('product')).toHaveCount(10)","expect(await page.getByTestId('product').count()).toBe(10)","await page.waitForTimeout(2000) і потім count()","expect((await page.getByTestId('product').all()).length).toBe(10)"],"e":"toHaveCount ретраїться. count() і all() повертають знімок у моменті й не чекають, доки з'являться всі елементи."},{"t":"Auto-waiting і асерти","l":"middle","q":"Чому page.waitForTimeout(3000) вважають антипатерном?","c":"","o":["Тест завжди чекає повний час і все одно не гарантує готовності — краще чекати умову через web-first асерт або waitForResponse","Метод не працює в headless","Він блокує всі інші воркери","Playwright його ігнорує"],"e":"Фіксоване очікування робить тести або повільними, або флакі. Документація прямо радить використовувати його лише для дебагу."},{"t":"Auto-waiting і асерти","l":"senior","q":"Як дочекатися умови, яку не перевіряє жоден вбудований асерт (наприклад, статус у базі)?","c":"","o":["expect.poll(() => getStatus(id)).toBe('completed') або блок expect(...).toPass()","while (true) з page.waitForTimeout(500)","Один раз перевірити і додати retries у конфіг","Вбудованих механізмів немає"],"e":"expect.poll повторює функцію, доки значення не задовольнить матчер; toPass повторює цілий блок перевірок. Обидва мають таймаут і інтервали."},{"t":"Auto-waiting і асерти","l":"senior","q":"Що таке expect.soft?","c":"","o":["Асерт, який при падінні не зупиняє тест: перевірки йдуть далі, а тест у кінці позначається як failed","Асерт з меншим таймаутом","Асерт, що ніколи не валить тест","Асерт, який перевіряє лише видимість"],"e":"Зручно, коли на одній сторінці треба перевірити багато незалежних полів і побачити всі розбіжності за один прогін."},{"t":"Browser, Context, Page","l":"junior","q":"Що таке BrowserContext?","c":"","o":["Ізольований сеанс усередині браузера: власні cookies, localStorage і кеш, як окремий профіль в інкогніто","Окремий процес браузера","Одна вкладка браузера","Конфігураційний файл Playwright"],"e":"Контекст створюється за мілісекунди, тому кожен тест отримує свій контекст — і тести ізольовані, не перезапускаючи браузер."},{"t":"Browser, Context, Page","l":"junior","q":"Яка ієрархія об'єктів у Playwright?","c":"","o":["Browser → BrowserContext → Page → Frame","Page → Browser → Context","Context → Browser → Page","Browser → Page → Context"],"e":"Один браузер може мати кілька контекстів, кожен контекст — кілька сторінок (вкладок), кожна сторінка — головний фрейм і вкладені iframe."},{"t":"Browser, Context, Page","l":"middle","q":"Як отримати сторінку, яка відкривається в новій вкладці після кліку?","c":"// ?\nawait page.getByRole('link', { name: 'Договір' }).click();\n// ?","o":["Спершу const pagePromise = context.waitForEvent('page'), потім клік, потім const newPage = await pagePromise","Після кліку взяти context.pages()[1] без очікування","page.switchTo().window(1)","Нові вкладки не підтримуються"],"e":"Очікування треба запустити до дії, інакше подія може статися раніше. Для попапів зі сторінки є також page.waitForEvent('popup')."},{"t":"Browser, Context, Page","l":"middle","q":"Як протестувати чат між двома користувачами в одному тесті?","c":"","o":["Створити два контексти через browser.newContext(), кожен зі своєю сесією, і відкрити в них по сторінці","Дві вкладки в одному контексті","Два окремі тести з обміном даними через файл","Неможливо в межах одного тесту"],"e":"Вкладки одного контексту ділять cookies, тому були б одним користувачем. Два контексти — два незалежні користувачі в одному браузері."},{"t":"Browser, Context, Page","l":"middle","q":"Чим за замовчуванням закінчується page.goto()?","c":"","o":["Чекає події load","Чекає, доки мережа повністю стихне","Повертається одразу після відправки запиту","Чекає першого кліку користувача"],"e":"Опція waitUntil змінює поведінку: domcontentloaded, load, networkidle, commit. networkidle не рекомендують для перевірок — краще чекати конкретний елемент."},{"t":"Browser, Context, Page","l":"senior","q":"Що Playwright робить з діалогами alert і confirm, якщо їх не обробляти?","c":"","o":["Автоматично закриває (dismiss)","Тест зависає до таймауту","Автоматично натискає OK","Тест падає з помилкою"],"e":"Щоб перевірити текст або прийняти діалог: page.once('dialog', d => d.accept()) — до дії, яка його викликає."},{"t":"Browser, Context, Page","l":"senior","q":"Як перевірити завантаження файлу (download)?","c":"","o":["const dl = page.waitForEvent('download'); клік; const file = await dl; далі file.suggestedFilename() і file.path()","Перевірити папку Downloads операційної системи","Завантаження в Playwright не підтримуються","Через page.route на URL файлу"],"e":"Так само працюють і upload: locator.setInputFiles(шлях) для поля вибору файлу."},{"t":"Фікстури й структура","l":"junior","q":"Що таке фікстури в @playwright/test?","c":"","o":["Механізм dependency injection: тест оголошує в аргументах, що йому потрібно (page, request, власні об'єкти), а ранер готує це і прибирає після тесту","JSON-файли з тестовими даними в папці fixtures","Хуки beforeAll і afterAll","Збережені скріншоти для порівняння"],"e":"На відміну від Cypress, де фікстура — файл даних, у Playwright це об'єкти з життєвим циклом: setup, використання в тесті, teardown."},{"t":"Фікстури й структура","l":"middle","q":"Що робить рядок await use(...) у фікстурі?","c":"export const test = base.extend<{ loginPage: LoginPage }>({\n  loginPage: async ({ page }, use) => {\n    const lp = new LoginPage(page);\n    await lp.open();\n    await use(lp);\n    await lp.logout();\n  },\n});","o":["Передає значення в тест і чекає, доки тест завершиться; код після нього — teardown","Реєструє фікстуру глобально","Повторює тест з новим значенням","Повертає значення і одразу завершує фікстуру"],"e":"Усе до use — підготовка, після — прибирання. Прибирання виконується навіть тоді, коли тест упав."},{"t":"Фікстури й структура","l":"middle","q":"Коли виконується фікстура, яку тест не оголосив у своїх аргументах?","c":"","o":["Ніколи: фікстури ліниві, якщо тільки не позначені { auto: true }","Перед кожним тестом файлу","Один раз на воркер","Після всіх тестів"],"e":"Тому дорогі фікстури не сповільнюють тести, яким вони не потрібні. auto: true — для того, що має працювати завжди, наприклад збирання логів."},{"t":"Фікстури й структура","l":"senior","q":"Чим фікстура scope: 'worker' відрізняється від 'test'?","c":"","o":["Створюється один раз на воркер-процес і ділиться між його тестами; 'test' — заново для кожного тесту","Працює лише в одному воркері","Виконується після всіх тестів","Різниці немає"],"e":"Worker-фікстури — для дорогих ресурсів: підключення до бази, тестовий акаунт на воркер. Стан у них спільний для тестів воркера, тому їх не можна мутувати як завгодно."},{"t":"Фікстури й структура","l":"middle","q":"Чому фікстури часто кращі за beforeEach?","c":"","o":["Вони перевикористовуються між файлами, комбінуються, ліниві й мають гарантований teardown поруч із setup","beforeEach у Playwright не існує","Фікстури виконуються паралельно, а beforeEach — ні","beforeEach не має доступу до page"],"e":"beforeEach живе в межах одного файлу, і setup з прибиранням розкидані по різних хуках. Фікстура інкапсулює весь життєвий цикл в одному місці."},{"t":"Фікстури й структура","l":"middle","q":"Навіщо test.step() у тесті?","c":"","o":["Групує дії в іменовані кроки, які видно в звіті й трейсі","Запускає кроки паралельно","Повторює крок при падінні","Пропускає крок, якщо він уже пройдений"],"e":"Звіт читається як сценарій: «Логін», «Додати товар», «Оплатити». Особливо корисно в Page Object і в BDD-підході."},{"t":"Мережа й API","l":"junior","q":"Для чого page.route()?","c":"","o":["Перехоплювати запити сторінки: підмінити відповідь, змінити запит або заблокувати його","Перейти на іншу сторінку","Задати базовий URL","Відправити запит з тесту напряму"],"e":"route.fulfill — повернути свою відповідь, route.continue — пропустити далі (можна зі зміненими заголовками), route.abort — обірвати запит."},{"t":"Мережа й API","l":"middle","q":"Як підмінити відповідь API помилкою 500?","c":"","o":["await page.route('**/api/pay', route => route.fulfill({ status: 500, json: { message: 'Error' } }))","await page.request.post('/api/pay', { failOnStatusCode: false })","await page.waitForResponse('**/api/pay')","await route.abort('500')"],"e":"Маршрут реєструють до дії, яка викликає запит. Далі перевіряють, що UI показує зрозуміле повідомлення."},{"t":"Мережа й API","l":"senior","q":"Як змінити одне поле в реальній відповіді сервера?","c":"","o":["const res = await route.fetch(); const json = await res.json(); json.balance = 0; await route.fulfill({ response: res, json })","route.continue({ body: { balance: 0 } })","route.fulfill({ json: { balance: 0 } }) без запиту на сервер","Неможливо, лише повна підміна"],"e":"route.fetch виконує справжній запит, а fulfill з response зберігає статус і заголовки оригіналу, підмінивши тіло."},{"t":"Мережа й API","l":"middle","q":"Як дочекатися конкретної відповіді після кліку і перевірити її?","c":"","o":["const resPromise = page.waitForResponse('**/api/orders'); клік; const res = await resPromise; expect(res.status()).toBe(201)","Після кліку викликати page.waitForResponse без збереження Promise","await page.waitForTimeout(2000)","page.route з fulfill"],"e":"Очікування запускають до дії — інакше відповідь може прийти раніше, ніж почнемо чекати, і тест зависне до таймауту."},{"t":"Мережа й API","l":"junior","q":"Що таке фікстура request?","c":"","o":["APIRequestContext для HTTP-запитів з тесту без браузера — для API-тестів і підготовки даних","Об'єкт перехопленого запиту сторінки","Налаштування мережі для браузера","Запис усіх запитів у HAR"],"e":"request.get/post/put/delete з baseURL з конфігу. Відповідь перевіряють через expect(res).toBeOK() або res.status()."},{"t":"Мережа й API","l":"senior","q":"Чи перехоплює page.route() запити, відправлені через фікстуру request?","c":"","o":["Ні: request — окремий HTTP-клієнт поза сторінкою","Так, усі запити тесту","Лише GET-запити","Лише якщо request створено з page"],"e":"route працює з запитами браузера. Водночас page.request ділить cookies з контекстом сторінки — зручно для API-дій від імені залогіненого користувача."},{"t":"Мережа й API","l":"senior","q":"Що робить page.routeFromHAR()?","c":"","o":["Відповідає на запити із записаного HAR-файлу — швидкий спосіб замокати багато ендпоінтів реальними відповідями","Записує трейс тесту","Експортує мережеві запити в Allure","Перевіряє схему відповідей"],"e":"HAR записують один раз з реального бекенду, а далі тести працюють стабільно без нього. Мінус — дані застарівають і HAR треба оновлювати."},{"t":"Авторизація і стан","l":"junior","q":"Що зберігає storageState?","c":"","o":["Cookies і localStorage контексту (за потреби й IndexedDB), щоб нові контексти стартували вже залогіненими","Скріншоти сторінки","Логін і пароль користувача","Стан змінних тесту"],"e":"Файл зберігають після логіну і передають у use: { storageState: 'auth/user.json' } — тести відкриваються без повторного логіну."},{"t":"Авторизація і стан","l":"middle","q":"Який рекомендований спосіб один раз залогінитися для всіх тестів?","c":"","o":["Setup-проєкт, який логіниться і зберігає storageState, а основні проєкти залежать від нього через dependencies","Логін у beforeEach кожного файлу","globalSetup — єдиний підтримуваний спосіб","Один тест-файл з test.describe.serial"],"e":"Setup-проєкт — звичайні тести: для них працюють трейси, фікстури й звіт. globalSetup теж можливий, але без цих переваг."},{"t":"Авторизація і стан","l":"middle","q":"Як в одному файлі запустити частину тестів без логіну, якщо в конфігу задано storageState?","c":"","o":["test.use({ storageState: { cookies: [], origins: [] } }) у потрібному describe","Видалити файл стану перед тестом","Викликати context.clearCookies() у кожному тесті","Це можливо лише в окремому проєкті"],"e":"test.use перевизначає опції для describe-блоку. Так само можна підставити стан іншої ролі: test.use({ storageState: 'auth/admin.json' })."},{"t":"Авторизація і стан","l":"senior","q":"Тести паралельно змінюють налаштування профілю того самого користувача і флакують. Що робити?","c":"","o":["Дати кожному воркеру свій акаунт: worker-scoped фікстура зі своїм storageState","Вимкнути паралельність для всього проєкту","Додати retries: 3","Збільшити таймаути"],"e":"storageState ізолює сесію браузера, а не дані на сервері. Якщо тести змінюють серверний стан, їм потрібні різні користувачі. Номер воркера — test.info().parallelIndex."},{"t":"Конфіг, паралельність, CI","l":"junior","q":"Як за замовчуванням паралеляться тести?","c":"","o":["Файли розподіляються між воркерами-процесами, а тести всередині файлу йдуть послідовно","Усі тести паралельно, навіть усередині файлу","Усе послідовно в одному процесі","Паралельно лише між браузерами"],"e":"fullyParallel: true або test.describe.configure({ mode: 'parallel' }) паралелять і тести всередині файлу — тоді вони мають бути повністю незалежними."},{"t":"Конфіг, паралельність, CI","l":"middle","q":"Чи можуть тести в різних воркерах ділити змінну на рівні модуля?","c":"","o":["Ні: кожен воркер — окремий процес зі своєю пам'яттю","Так, змінні спільні для всіх воркерів","Так, якщо оголосити її через const","Лише в headed-режимі"],"e":"Спільний стан між тестами — антипатерн. Дані передають через фікстури, файли (як storageState) або зовнішнє сховище."},{"t":"Конфіг, паралельність, CI","l":"middle","q":"Що таке шардинг і як зібрати один звіт?","c":"","o":["--shard=1/4 ділить тести між машинами CI; кожна пише blob-звіт, а npx playwright merge-reports об'єднує їх","Розбиття одного тесту на кроки","Запуск тестів у кількох браузерах","Кешування браузерів у CI"],"e":"Workers паралелять на одній машині, шарди — між машинами. Обидва механізми комбінуються."},{"t":"Конфіг, паралельність, CI","l":"middle","q":"Що означає статус flaky у звіті Playwright?","c":"","o":["Тест упав, але пройшов під час повторного запуску (retries)","Тест пропущено через test.skip","Тест перевищив таймаут","Тест позначено як нестабільний вручну"],"e":"Flaky-тести не валять прогін, але їх треба розбирати: повтор маскує проблему. Добре, що трейс на першому ретраї показує саме падіння."},{"t":"Конфіг, паралельність, CI","l":"middle","q":"Для чого projects у playwright.config?","c":"","o":["Запускати ті самі тести в різних конфігураціях: браузери, пристрої, ролі, а також setup-проєкти з залежностями","Розділяти репозиторій на кілька npm-пакетів","Задавати різні baseURL для кожного файлу","Групувати звіти Allure"],"e":"Типово: setup → chromium, firefox, webkit з dependencies: ['setup']. Можна запустити один проєкт: npx playwright test --project=chromium."},{"t":"Конфіг, паралельність, CI","l":"middle","q":"Навіщо секція webServer у конфігу?","c":"","o":["Playwright сам запускає застосунок перед тестами і чекає, доки він стане доступним","Задає адресу Playwright-сервера в хмарі","Вмикає перехоплення мережі","Налаштовує проксі"],"e":"Зручно локально й у CI: npm run start піднімається автоматично, а reuseExistingServer дозволяє використати вже запущений сервер."},{"t":"Конфіг, паралельність, CI","l":"senior","q":"Тести стабільні локально, але флакують у CI. З чого почати?","c":"","o":["Відкрити трейс падіння, відтворити в тому ж Docker-образі й кількості воркерів, перевірити залежність від даних, порядку й ресурсів","Збільшити всі таймаути вдвічі","Додати waitForTimeout перед кожною дією","Встановити retries: 5"],"e":"Часті причини в CI: менше ресурсів і більше воркерів, спільні тестові дані, інший розмір вікна, залежність від порядку тестів."},{"t":"Дебаг і звіти","l":"junior","q":"Що таке Trace Viewer?","c":"","o":["Запис виконання тесту: кожна дія зі знімком DOM до й після, мережа, консоль і джерело — можна «прокрутити» тест назад","Відео прогону тесту","Лог у терміналі","Плагін для Chrome DevTools"],"e":"Відкривається через npx playwright show-trace trace.zip або прямо з HTML-звіту. Головний інструмент для розбору падінь у CI."},{"t":"Дебаг і звіти","l":"middle","q":"Що означає trace: 'on-first-retry'?","c":"","o":["Трейс записується лише під час першого повторного запуску тесту, що впав","Трейс пишеться для всіх тестів","Трейс пишеться лише для першого тесту файлу","Трейс вимкнений, поки не ввімкнеш retries у CLI"],"e":"Компроміс між корисністю й швидкістю: успішні тести не платять за запис, а для падінь трейс є. Працює лише якщо retries більше нуля."},{"t":"Дебаг і звіти","l":"junior","q":"Як покроково дебажити тест?","c":"","o":["npx playwright test --debug або await page.pause() у потрібному місці; також UI-режим --ui","Лише через console.log","Тільки через Trace Viewer після прогону","Через DevTools браузера без Playwright Inspector"],"e":"Inspector дає крокувати по діях і підбирати локатори; UI-режим показує тести з time-travel і перезапуском при змінах файлів."},{"t":"Дебаг і звіти","l":"middle","q":"Для чого npx playwright codegen?","c":"","o":["Записує дії в браузері й генерує код тесту з рекомендованими локаторами — як старт або щоб підібрати локатор","Генерує Page Object з усіх сторінок сайту","Компілює TypeScript-тести","Створює конфіг проєкту"],"e":"Згенерований код — чернетка: його треба переписати в структуру проєкту, додати асерти й прибрати зайве."},{"t":"Дебаг і звіти","l":"senior","q":"toHaveScreenshot() у CI падає, хоча локально проходить. Найімовірніша причина?","c":"","o":["Еталонні скріншоти залежать від ОС і браузера: шрифти й рендеринг відрізняються, тому еталони генерують у тому ж середовищі, що й CI","У CI вимкнений GPU, тому скріншоти неможливі","toHaveScreenshot працює лише в headed-режимі","Потрібен окремий платний сервіс"],"e":"Playwright додає до імені еталона платформу. Практика — оновлювати еталони через --update-snapshots у Docker-образі Playwright, і маскувати динамічні частини опцією mask."}],"cypress":[{"t":"Архітектура","l":"junior","q":"Де виконується код тесту Cypress?","c":"","o":["У тому самому браузері, що й застосунок, а окремий Node-процес відповідає за проксі, файли й задачі","В окремому Node-процесі, який керує браузером через WebDriver","На серверах Cypress Cloud, а браузер лише показує результат","У headless-браузері, ізольованому від DOM застосунку"],"e":"Тест живе в тій самій вкладці, що й застосунок, тому має прямий доступ до DOM без протоколу-посередника. Звідси автоочікування й time-travel. Node-частина — це проксі для мережі, файлова система, cy.task."},{"t":"Архітектура","l":"junior","q":"Який браузер Cypress не підтримує нативно?","c":"","o":["Safari","Chrome","Firefox","Edge"],"e":"Підтримуються сімейство Chrome (Chrome, Edge, Electron) і Firefox. WebKit — лише експериментально, справжній Safari — ні. Також немає мобільних браузерів і нативних застосунків."},{"t":"Архітектура","l":"middle","q":"Посилання відкриває сторінку в новій вкладці (target=\"_blank\"). Як це тестують у Cypress?","c":"","o":["Cypress не працює з кількома вкладками: перевіряють атрибут href або прибирають target і відкривають сторінку в поточній вкладці","Перемикаються на нову вкладку командою cy.switchTab()","Cypress автоматично переходить у нову вкладку після кліку","Через cy.origin(), який відкриває нову вкладку"],"e":"Тест живе всередині однієї вкладки, тому кілька вкладок не підтримуються. Типові рішення: перевірити href, або зняти target через invoke('removeAttr', 'target') і клікнути."},{"t":"Архітектура","l":"middle","q":"Для чого потрібен cy.origin()?","c":"","o":["Щоб виконувати команди на сторінці іншого домену в межах тесту, наприклад під час SSO-логіну","Щоб змінити baseUrl посеред тесту","Щоб відкрити нову вкладку","Щоб обійти CORS у cy.request"],"e":"Код тесту за замовчуванням прив'язаний до одного origin. cy.origin() дає змогу виконати блок команд на іншому домені — класичний випадок: редирект на сторінку провайдера авторизації."},{"t":"Архітектура","l":"senior","q":"Як Cypress запускає тести паралельно?","c":"","o":["Розподіляє спек-файли між кількома машинами: через Cypress Cloud (--record --parallel) або ручним розбиттям у CI","Запускає кілька воркерів на одній машині за замовчуванням","Паралелить тести всередині одного спек-файлу","Паралельності немає взагалі"],"e":"На одній машині спеки виконуються послідовно. Паралельність — лише між машинами: платно через Cloud або безкоштовно, розбивши спеки по джобах CI самостійно чи плагіном."},{"t":"Черга команд","l":"junior","q":"Що повертає cy.get()?","c":"","o":["Chainable: команда стає в чергу і виконається пізніше","Promise, який розв'язується елементом","jQuery-об'єкт із знайденими елементами одразу","Масив DOM-елементів"],"e":"cy.get у момент виклику нічого не шукає — лише додає команду в чергу. Chainable — це не Promise і не елемент, а обгортка для продовження ланцюжка."},{"t":"Черга команд","l":"junior","q":"У якому порядку з'являться логи в консолі?","c":"cy.visit('/login')\nconsole.log('A')\ncy.get('h1').then(() => console.log('B'))\nconsole.log('C')","o":["A, C, B","A, B, C","B, A, C","C, A, B"],"e":"Тіло тесту спочатку виконується синхронно: console.log('A') і ('C') спрацьовують одразу, поки будується черга. Колбек then виконається пізніше, коли Cypress дійде до нього в черзі."},{"t":"Черга команд","l":"middle","q":"Чому в Cypress не пишуть await cy.get()?","c":"","o":["Команди Cypress — не Promise, а черга виконується окремо; await нічого не дасть або зламає порядок","await працює, але сповільнює тести","await дозволений лише всередині before()","await потрібен тільки для cy.request"],"e":"Cypress сам керує чергою і проганяє її після того, як тіло тесту відпрацювало. Значення отримують у .then(), перевіряють через .should()."},{"t":"Черга команд","l":"middle","q":"Що виведе cy.log(total)?","c":"let total\ncy.get('[data-cy=total]').then(($el) => {\n  total = $el.text()\n})\ncy.log(total)","o":["undefined — аргумент cy.log обчислюється під час побудови черги, ще до виконання then","Текст елемента total","Порожній рядок","Тест упаде з помилкою"],"e":"cy.log(total) викликається синхронно, коли total ще не присвоєний. Правильно — логувати всередині then або обгорнути: cy.then(() => cy.log(total))."},{"t":"Черга команд","l":"senior","q":"Що станеться, якщо в .then() викликати cy-команду і водночас повернути звичайне значення?","c":"cy.get('h1').then(($h) => {\n  cy.log('title')\n  return $h.text()\n})","o":["Cypress кине помилку: не можна змішувати cy-команди й повернення синхронного значення","Наступна команда отримає текст заголовка","Наступна команда отримає результат cy.log","Повернене значення буде проігноровано без помилки"],"e":"Якщо в колбеку є cy-команди, subject визначає остання з них. Одночасне return звичайного значення Cypress вважає помилкою змішування async і sync коду."},{"t":"Retry-ability і очікування","l":"junior","q":"Що таке retry-ability?","c":"","o":["Автоматичне повторення queries разом з асертами, доки асерт не пройде або не мине таймаут","Повторний запуск усього тесту після падіння","Повтор HTTP-запитів, що повернули 500","Повтор кліку, якщо він не спрацював"],"e":"Cypress повторно перешукує елемент і перевіряє умову, поки вона не стане правдивою або не мине defaultCommandTimeout. Повтор цілого тесту — це окреме налаштування retries."},{"t":"Retry-ability і очікування","l":"junior","q":"Яке значення defaultCommandTimeout за замовчуванням?","c":"","o":["4 секунди","2 секунди","10 секунд","30 секунд"],"e":"4000 мс. Для довгих операцій таймаут змінюють точково: cy.get(sel, { timeout: 10000 }), а не глобально."},{"t":"Retry-ability і очікування","l":"middle","q":"Які команди не ретраяться?","c":"","o":["click, type, check — дії","get, find — queries","should — асерти","contains, its — queries"],"e":"Дії виконуються один раз: повторний клік міг би, наприклад, двічі створити замовлення. Але перед дією Cypress чекає на actionability елемента."},{"t":"Retry-ability і очікування","l":"middle","q":"Статус змінюється на 'Paid' через 1 секунду після завантаження. Що буде з тестом?","c":"cy.get('[data-cy=status]').then(($el) => {\n  expect($el.text()).to.eq('Paid')\n})","o":["Найімовірніше впаде: then виконується один раз і не ретраїться","Пройде: then чекає до 4 секунд","Пройде: expect усередині then ретраїться","Зависне до pageLoadTimeout"],"e":"Заміни then на should з тим самим колбеком — тоді Cypress повторюватиме get і expect, доки текст не стане 'Paid'. Або просто: .should('have.text', 'Paid')."},{"t":"Retry-ability і очікування","l":"middle","q":"Що Cypress перевіряє перед click() (actionability)?","c":"","o":["Елемент видимий, не disabled, не відірваний від DOM, не анімується і не перекритий іншим елементом","Лише те, що елемент існує в DOM","Що на елементі є обробник події click","Що всі мережеві запити завершені"],"e":"Поки умови не виконані, Cypress чекає до таймауту. { force: true } пропускає ці перевірки — і може приховати реальний баг, наприклад перекриту кнопку."},{"t":"Retry-ability і очікування","l":"senior","q":"Що змінилося в ретраях у Cypress 12?","c":"","o":["Повторюється весь ланцюжок queries, а не лише остання команда","Дії теж почали ретраїтися",".then() почав ретраїтися","Ретраї вимкнули за замовчуванням"],"e":"Раніше cy.get('.list').find('li').should(...) перешукував лише li у вже знайденому .list. Тепер, якщо .list перемалювався, Cypress заново проходить увесь ланцюжок queries."},{"t":"Retry-ability і очікування","l":"middle","q":"Чому cy.wait(3000) вважають антипатерном?","c":"","o":["Тест завжди чекає повний час і все одно не гарантує готовності — краще чекати умову: асерт або alias запиту","Він не працює в headless-режимі","Він ламає cy.intercept","Cypress ігнорує фіксовані очікування"],"e":"Фіксоване очікування або занадто довге (повільні тести), або закоротке (флакі). Надійно: cy.wait('@alias') або асерт, що ретраїться."},{"t":"Retry-ability і очікування","l":"senior","q":"Після кліку React замінює вузол кнопки новим. У чому ризик?","c":"cy.get('[data-cy=submit]').click().should('have.class', 'active')","o":["Асерт працює з елементом, який отримав click; якщо його замінили, перевірка впаде — краще новий ланцюжок cy.get(...).should(...)","Ризику немає: should завжди перешукує елемент з нуля","click спрацює двічі через ретрай","should виконається до кліку"],"e":"click — дія, а не query, тому після нього subject — конкретний елемент. Новий ланцюжок із cy.get перешукує свіжий елемент і ретраїться."},{"t":"Локатори","l":"junior","q":"Який селектор найнадійніший?","c":"","o":["[data-cy=submit]",".btn.btn-primary","#app > div:nth-child(3) button","//button[text()='Pay']"],"e":"Окремий тестовий атрибут не залежить від стилів, структури DOM і тексту, тому не ламається від редизайну. Його додають до розмітки разом з розробниками."},{"t":"Локатори","l":"junior","q":"Чи підтримує Cypress XPath з коробки?","c":"","o":["Ні, лише CSS-селектори через jQuery; плагін для XPath існував, але застарів","Так, cy.get розпізнає XPath автоматично","Так, через cy.xpath() без плагінів","Лише в Firefox"],"e":"Пошук іде через jQuery-рушій, тому працюють CSS і jQuery-псевдокласи на кшталт :contains. Для пошуку за текстом є cy.contains."},{"t":"Локатори","l":"middle","q":"Чим cy.get() відрізняється від .find()?","c":"","o":["get шукає від кореня документа (або в межах within), find — лише всередині поточного subject","Нічим, це синоніми","find швидший, бо кешує результат","get шукає лише за id"],"e":"Тому для пошуку всередині контейнера використовують cy.get('.cart').find('li') або .within()."},{"t":"Локатори","l":"middle","q":"Що знайде цей код?","c":"cy.get('[data-cy=cart]').get('li')","o":["Усі li на сторінці: get завжди шукає від кореня документа","Лише li всередині кошика","Перший li у кошику","Тест упаде з помилкою"],"e":"Класична пастка. Правильно: cy.get('[data-cy=cart]').find('li')."},{"t":"Локатори","l":"middle","q":"Що робить cy.contains('button', 'Оплатити')?","c":"","o":["Знаходить кнопку, яка містить текст «Оплатити»","Перевіряє, що текст є будь-де на сторінці, і нічого не повертає","Клікає на кнопку з цим текстом","Повертає всі кнопки на сторінці"],"e":"contains повертає один елемент, що містить текст; перший аргумент-селектор звужує пошук. Це query, тому ретраїться."},{"t":"Локатори","l":"senior","q":"Список товарів підвантажується асинхронно. Як надійно перевірити, що їх 10?","c":"","o":["cy.get('[data-cy=product]').should('have.length', 10)","cy.get('[data-cy=product]').then(($els) => expect($els.length).to.eq(10))","cy.wait(2000) і потім перевірка довжини","cy.get('[data-cy=product]').its('length').then((n) => expect(n).to.eq(10))"],"e":"should ретраїть і пошук, і перевірку, доки не з'являться всі 10. Варіанти з then перевіряють довжину один раз — у момент, коли знайшовся хоча б один елемент."},{"t":"Мережа: cy.intercept","l":"junior","q":"Для чого потрібен cy.intercept?","c":"","o":["Стежити за мережевими запитами застосунку (spy) або підміняти їхні відповіді (stub)","Надсилати HTTP-запити з тесту напряму","Блокувати всі сторонні скрипти","Перехоплювати помилки JavaScript на сторінці"],"e":"Spy — запит іде на сервер, а ми можемо дочекатися його й перевірити. Stub — відповідь підставляє тест: фікстура, статус, затримка."},{"t":"Мережа: cy.intercept","l":"junior","q":"Що буде, якщо зареєструвати intercept після кліку, який запускає запит?","c":"","o":["Запит проскочить, і cy.wait('@alias') впаде за таймаутом","Cypress перехопить запит заднім числом","Запит буде заблоковано","Нічого: порядок не має значення"],"e":"Intercept треба реєструвати до дії, яка викликає запит. Для запитів під час завантаження сторінки — до cy.visit."},{"t":"Мережа: cy.intercept","l":"middle","q":"Чим є такий intercept?","c":"cy.intercept('GET', '/api/products').as('getProducts')","o":["Spy: запит іде на реальний сервер, а ми можемо його дочекатися й перевірити","Stub з порожньою відповіддю","Блокуванням запиту","Помилкою: потрібно передати відповідь"],"e":"Без третього аргументу intercept лише спостерігає. Щойно передаєш відповідь — тіло, фікстуру, statusCode — він стає stub."},{"t":"Мережа: cy.intercept","l":"middle","q":"Що повертає cy.wait('@createOrder')?","c":"","o":["Об'єкт interception з request і response","Лише тіло відповіді","Лише статус-код","Нічого, він лише чекає"],"e":"Тому можна перевірити і те, що фронтенд відправив (request.body, headers), і що повернув сервер (response.statusCode, response.body)."},{"t":"Мережа: cy.intercept","l":"middle","q":"Як перевірити, що фронтенд відправив у замовленні 2 товари?","c":"","o":["cy.wait('@createOrder').its('request.body.items').should('have.length', 2)","cy.get('@createOrder').its('response.body.items').should('have.length', 2)","cy.request('POST', '/api/orders').its('body.items').should('have.length', 2)","cy.wait('@createOrder').its('response.statusCode').should('eq', 2)"],"e":"Перевіряємо саме request — те, що пішло від клієнта. cy.request у третьому варіанті відправив би новий запит з тесту і нічого не сказав би про поведінку фронтенду."},{"t":"Мережа: cy.intercept","l":"senior","q":"Чи перехопить cy.intercept запит, відправлений через cy.request?","c":"","o":["Ні: cy.request іде з Node-процесу повз браузер","Так, intercept ловить усі запити","Так, але лише GET-запити","Лише якщо вказати { intercept: true }"],"e":"intercept бачить запити, які робить застосунок у браузері. cy.request — окремий HTTP-клієнт тесту."},{"t":"Мережа: cy.intercept","l":"middle","q":"Як перевірити реакцію UI на помилку сервера при оплаті?","c":"","o":["cy.intercept('POST', '/api/pay', { statusCode: 500, body: { message: 'Error' } })","cy.request({ method: 'POST', url: '/api/pay', failOnStatusCode: false })","cy.intercept('POST', '/api/pay').as('pay') і cy.wait('@pay')","Вимкнути бекенд перед тестом"],"e":"Stub з потрібним статусом відтворює помилку без реального збою сервера. Далі перевіряємо, що UI показує зрозуміле повідомлення і не списує гроші двічі."},{"t":"Мережа: cy.intercept","l":"senior","q":"Як змінити лише одне поле в реальній відповіді сервера?","c":"cy.intercept('GET', '/api/balance', (req) => {\n  // ?\n})","o":["req.continue((res) => { res.body.amount = 0 })","req.reply({ fixture: 'balance.json' })","req.body.amount = 0","Неможливо: можна лише повністю замінити відповідь"],"e":"req.continue пропускає запит на сервер і дає змінити справжню відповідь перед тим, як вона дійде до застосунку. req.reply повністю підмінює відповідь, а req.body — це тіло запиту, а не відповіді."},{"t":"Мережа: cy.intercept","l":"senior","q":"Як перевірити лоадер під час повільного запиту?","c":"","o":["Stub з delay, перевірити, що лоадер видимий, потім — що зник","cy.wait(5000) перед перевіркою лоадера","Увімкнути throttling у DevTools вручну","Лоадер у Cypress перевірити неможливо"],"e":"cy.intercept('GET', '/api/products', { fixture: 'products.json', delay: 2000 }), далі should('be.visible') для лоадера і should('not.exist') після відповіді."},{"t":"cy.request і API","l":"junior","q":"Що зробить cy.request за замовчуванням, якщо сервер поверне 404?","c":"","o":["Тест упаде","Поверне відповідь зі статусом 404","Повторить запит","Поверне null"],"e":"cy.request падає на будь-якому статусі, крім 2xx і 3xx. Для негативних перевірок додають failOnStatusCode: false."},{"t":"cy.request і API","l":"junior","q":"Який HTTP-метод відправить цей запит?","c":"cy.request({ url: '/api/products/1', failOnStatusCode: false })","o":["GET — метод за замовчуванням","POST","Помилка: метод обов'язковий","HEAD"],"e":"Якщо method не вказано, Cypress бере GET. Для читабельності в тестах із кількома методами його часто пишуть явно."},{"t":"cy.request і API","l":"middle","q":"А цей запит?","c":"cy.request('/api/users', { name: 'Ann' })","o":["POST: у формі (url, body) метод змінюється на POST","GET з query-параметром name","PUT","Помилка синтаксису"],"e":"Пастка: у короткій формі з тілом метод за замовчуванням — POST. Query-параметри для GET передають через qs в об'єкті опцій."},{"t":"cy.request і API","l":"middle","q":"Як використати id створеного товару в наступному запиті?","c":"","o":["Отримати його в .then() і викликати наступний cy.request усередині колбеку","const id = cy.request(...).its('body.id') і далі використати id","Записати в глобальну змінну і використати рядком нижче поза then","Через await cy.request(...)"],"e":"Значення доступне лише після виконання команди — тобто в колбеку then. Альтернатива — alias через .as('id') і this.id у function-колбеках."},{"t":"cy.request і API","l":"middle","q":"Як cy.request працює з cookies?","c":"","o":["Автоматично надсилає cookies браузера і зберігає ті, що прийшли у відповіді","Ігнорує cookies повністю","Надсилає cookies лише з опцією withCookies: true","Очищає cookies після кожного запиту"],"e":"Тому логін через API працює: після cy.request на /login сесійна cookie вже є в браузері, і cy.visit відкриває сторінку як залогінений користувач."},{"t":"cy.request і API","l":"senior","q":"Як перевірити, що без токена API повертає 401?","c":"","o":["cy.request({ url: '/api/me', failOnStatusCode: false }).its('status').should('eq', 401)","cy.request('/api/me').its('status').should('eq', 401)","cy.intercept('/api/me', { statusCode: 401 })","cy.request('/api/me').should('fail')"],"e":"Без failOnStatusCode: false тест упаде на самому запиті ще до асерта. Варіант з intercept нічого не перевіряє — він сам підставляє 401."},{"t":"Сесії та ізоляція","l":"junior","q":"Що робить testIsolation (увімкнений за замовчуванням)?","c":"","o":["Перед кожним тестом очищає cookies, localStorage, sessionStorage і скидає сторінку","Запускає кожен тест в окремому браузері","Перезапускає сервер застосунку","Ізолює тести від мережі"],"e":"Так тести не залежать від порядку виконання. Наслідок: стан на кшталт логіну треба відновлювати в кожному тесті — для цього є cy.session."},{"t":"Сесії та ізоляція","l":"middle","q":"Де cy.session зберігає сесію?","c":"","o":["У кеші Cypress на час прогону: cookies, localStorage і sessionStorage під ідентифікатором сесії","У JSON-файлі в папці fixtures","У cypress.env.json","На сервері застосунку"],"e":"Перший виклик виконує функцію логіну і робить знімок стану. Наступні — відновлюють знімок на вже очищений браузер, не логінячись заново."},{"t":"Сесії та ізоляція","l":"middle","q":"Навіщо cy.session опція validate?","c":"","o":["Перевірити, що кешована сесія ще дійсна; якщо ні — логін виконається заново","Перевірити правильність пароля","Перевірити схему відповіді логіну","Заборонити повторне використання сесії"],"e":"Наприклад: validate() { cy.request('/api/me').its('status').should('eq', 200) }. Якщо токен протух, Cypress сам виконає setup знову."},{"t":"Сесії та ізоляція","l":"middle","q":"Тест падає на першому cy.get одразу після cy.session. Найімовірніша причина?","c":"","o":["cy.session не відкриває сторінку — після нього потрібен cy.visit","cy.session потрібно викликати в after()","Сесію не можна використовувати з data-cy селекторами","cy.session працює лише в headless-режимі"],"e":"Після відновлення сесії браузер на about:blank. Тому в beforeEach: спочатку cy.login() з cy.session, потім cy.visit."},{"t":"Сесії та ізоляція","l":"senior","q":"Логін зроблено в before(), testIsolation увімкнений. Що станеться з другим тестом?","c":"","o":["Він буде незалогінений: стан очищається перед кожним тестом","Він успадкує сесію першого тесту","Cypress виконає before() ще раз","Тест буде пропущено"],"e":"before() виконується один раз на блок, а очищення — перед кожним тестом. Логін через cy.session кладуть у beforeEach."},{"t":"Сесії та ізоляція","l":"senior","q":"Що робить cacheAcrossSpecs: true у cy.session?","c":"","o":["Дозволяє перевикористати кешовану сесію між різними спек-файлами","Зберігає сесію між окремими запусками cypress run","Вимикає testIsolation","Кешує фікстури"],"e":"За замовчуванням сесія живе в межах одного спек-файлу. З прапорцем — на весь прогін, що пришвидшує великі набори тестів."},{"t":"Структура проєкту","l":"junior","q":"Що таке фікстури в Cypress?","c":"","o":["Файли зі статичними тестовими даними в cypress/fixtures, які читають через cy.fixture або підставляють у intercept","Механізм dependency injection, як у Playwright","Хуки before і after","Збережені сесії користувачів"],"e":"У Cypress фікстура — це просто файл даних. DI-фікстури — концепція Playwright. Для унікальних даних (email при реєстрації) фікстура не підходить — їх генерують."},{"t":"Структура проєкту","l":"middle","q":"Що краще оформити кастомною командою, а не функцією-утилітою?","c":"","o":["Логін через API з cy.session усередині","Генерацію випадкового email","Розрахунок очікуваної комісії","Форматування дати для порівняння"],"e":"Кастомна команда — для повторюваних дій з cy-командами всередині. Чиста логіка без Cypress — звичайна функція, яку імпортують."},{"t":"Структура проєкту","l":"middle","q":"Що робить cy.wrap()?","c":"","o":["Загортає звичайне значення або Promise у Chainable, щоб застосувати до нього команди Cypress","Обгортає тест у транзакцію","Об'єднує кілька команд в одну","Перехоплює помилки в ланцюжку"],"e":"cy.wrap(user).its('name').should('eq', 'Ann'); cy.wrap(promise) змушує Cypress дочекатися Promise у черзі; cy.wrap($el).click() — для jQuery-елемента всередині then."},{"t":"Структура проєкту","l":"middle","q":"Навіщо потрібен cy.task()?","c":"","o":["Виконати код у Node-процесі: запит до бази, робота з файлами, логування в термінал","Запустити окремий тест","Поставити команду в чергу з пріоритетом","Виконати JavaScript на сторінці застосунку"],"e":"Код тесту працює в браузері й не має доступу до бази чи файлової системи. cy.task викликає обробник, зареєстрований у setupNodeEvents."},{"t":"Структура проєкту","l":"senior","q":"Обробник cy.task('seedDb') у Node нічого не повертає. Що буде?","c":"","o":["Тест упаде: обробник task має повернути значення, null або Promise","Тест пройде, subject буде undefined","Cypress повторюватиме task до таймауту","Нічого: значення повернення ігнорується"],"e":"Повернення undefined Cypress вважає помилкою. Якщо повертати нічого — return null."},{"t":"Структура проєкту","l":"middle","q":"Що відбувається при cy.get('@btn') після cy.get('[data-cy=submit]').as('btn')?","c":"","o":["Cypress заново виконує збережений запит і повертає свіжий елемент","Повертає той самий DOM-елемент, навіть якщо його замінили","Повертає селектор рядком","Помилка: alias працює лише з intercept"],"e":"З Cypress 12 аліаси на queries перешукують елемент, тому це безпечно, на відміну від збереження Chainable у змінну."},{"t":"Структура проєкту","l":"senior","q":"Що потрібно, щоб TypeScript знав про кастомну команду cy.login()?","c":"","o":["Оголосити її в інтерфейсі Chainable всередині declare global { namespace Cypress { … } }","Нічого: типи генеруються автоматично","Додати її в tsconfig.json у поле commands","Імпортувати commands.ts у кожен тест"],"e":"Без оголошення типу TypeScript підкреслить cy.login як неіснуючий метод, хоча в рантаймі команда працюватиме."},{"t":"Конфіг і CI","l":"junior","q":"Навіщо задавати baseUrl у cypress.config?","c":"","o":["Щоб писати відносні шляхи в cy.visit і cy.request і легко міняти середовище","Щоб Cypress знав, де лежать тести","Щоб увімкнути перехоплення запитів","Щоб задати адресу Cypress Cloud"],"e":"cy.visit('/login') підставить baseUrl. Для іншого середовища достатньо змінити одне значення або передати його через змінну оточення в CI."},{"t":"Конфіг і CI","l":"middle","q":"Тести лежать у cypress/api, а Cypress пише «no spec files were found». Що змінити?","c":"","o":["specPattern у конфігу, наприклад 'cypress/api/**/*.cy.ts'","supportFile","baseUrl","fixturesFolder"],"e":"За замовчуванням для e2e Cypress шукає спеки в cypress/e2e. Інша папка вимагає явного specPattern."},{"t":"Конфіг і CI","l":"middle","q":"Що означає retries: { runMode: 2, openMode: 0 }?","c":"","o":["У cypress run тест, що впав, повториться до 2 разів, в інтерактивному cypress open — ні","Кожен тест завжди запускається двічі","Кожна команда ретраїться двічі","У CI максимум 2 тести можуть впасти"],"e":"За замовчуванням ретраї вимкнені. Вони маскують флакі, тому повтори варто моніторити, а не просто вмикати."},{"t":"Конфіг і CI","l":"middle","q":"Що в сучасному Cypress відбувається за замовчуванням під час cypress run?","c":"","o":["Скріншот при падінні робиться, відео не записується (вимкнене з версії 13)","Записується відео кожного тесту","Не робиться ні скріншотів, ні відео","Записується відео лише тестів, що впали"],"e":"Відео вмикають явно: video: true. Скріншоти на падінні — screenshotOnRunFailure, увімкнено за замовчуванням."},{"t":"Конфіг і CI","l":"senior","q":"Тест стабільний локально, але флакує в CI. З чого почати?","c":"","o":["Зібрати артефакти (скріншот, відео, логи), відтворити в тому самому Docker-образі й headless-режимі, перевірити залежність від даних і таймінгів","Збільшити defaultCommandTimeout до 30 секунд","Додати cy.wait(2000) перед кожною дією","Увімкнути retries і закрити задачу"],"e":"CI зазвичай повільніший, з іншими розмірами вікна й даними. Глобальний таймаут чи ретраї приховують причину; спершу — відтворити й зрозуміти."}],"typescript":[{"t":"Основи","l":"junior","q":"Що відбувається з типами TypeScript після компіляції?","c":"","o":["Вони стираються, у JavaScript залишається лише код без типів","Вони перетворюються на перевірки в рантаймі","Вони зберігаються як метадані, доступні через typeof","Вони кидають TypeError, якщо значення не відповідає типу"],"e":"TypeScript перевіряє типи тільки під час компіляції (type erasure). У рантаймі ніякої перевірки немає, тому дані з API чи JSON треба валідувати окремо, наприклад схемою."},{"t":"Основи","l":"junior","q":"Чим unknown відрізняється від any?","c":"","o":["unknown можна використати лише після звуження типу, any вимикає перевірки повністю","Нічим, це синоніми","unknown не можна присвоїти змінній","any безпечніший, бо його не можна викликати"],"e":"З any можна робити що завгодно, компілятор мовчить. З unknown не можна викликати методи чи звертатися до полів, доки не звузиш тип через typeof, instanceof чи type guard. Для даних ззовні правильний вибір unknown."},{"t":"Основи","l":"junior","q":"Які типи виведе TypeScript?","c":"let a = 'hi';\nconst b = 'hi';","o":["a: string, b: \"hi\"","a: \"hi\", b: \"hi\"","a: string, b: string","a: any, b: string"],"e":"let можна переприсвоїти, тому тип розширюється (widening) до string. const не змінюється, тому лишається літеральний тип \"hi\"."},{"t":"Основи","l":"junior","q":"Який тип має масив?","c":"const arr = [1, 'a', 2];","o":["(string | number)[]","[number, string, number]","any[]","number[]"],"e":"Літерал масиву виводиться як масив union-типу. Кортеж [number, string, number] вийде лише з явною анотацією або as const (тоді ще й readonly)."},{"t":"Основи","l":"junior","q":"Що дає as const для об'єкта?","c":"const cfg = { env: 'prod', retries: 2 } as const;","o":["Усі поля стають readonly з літеральними типами: env: \"prod\", retries: 2","Об'єкт заморожується в рантаймі, як Object.freeze","Тільки сам об'єкт стає readonly, поля лишаються string і number","Нічого, as const працює тільки для масивів"],"e":"as const робить глибоко readonly і звужує значення до літералів. У рантаймі це нічого не змінює, на відміну від Object.freeze."},{"t":"Основи","l":"junior","q":"Коли використовується тип never?","c":"","o":["Для значень, яких не може бути: функція завжди кидає помилку, вичерпаний union","Як синонім void","Для null і undefined","Для змінних без ініціалізації"],"e":"never це порожній тип. Функція, що завжди кидає, повертає never. Після перевірки всіх варіантів union залишається never, на цьому будується exhaustive check."},{"t":"Основи","l":"junior","q":"Який тип має параметр всередині функції?","c":"function f(timeout?: number) {\n  // timeout: ?\n}","o":["number | undefined","number","number | null","any"],"e":"Необов'язковий параметр додає undefined до типу. Перед арифметикою його треба звузити або задати дефолт: timeout = 5000."},{"t":"Основи","l":"junior","q":"Чому дорівнює Dir.Down і Dir[0]?","c":"enum Dir { Up, Down }","o":["Dir.Down = 1, Dir[0] = \"Up\"","Dir.Down = \"Down\", Dir[0] = undefined","Dir.Down = 2, Dir[0] = \"Up\"","Dir.Down = 1, Dir[0] = помилка компіляції"],"e":"Числовий enum нумерується з 0 і має зворотне відображення: значення в назву. Рядкові enum зворотного відображення не мають. Багато команд замість enum беруть union літералів або as const об'єкт."},{"t":"Основи","l":"junior","q":"Чому дорівнюють n і m?","c":"const n = 0 ?? 5;\nconst m = 0 || 5;","o":["n = 0, m = 5","n = 5, m = 5","n = 0, m = 0","n = 5, m = 0"],"e":"?? підставляє праве значення тільки для null і undefined. || спрацьовує на будь-яке falsy: 0, \"\", false, NaN. Для таймаутів і сум 0 валідне значення, тому потрібен ??."},{"t":"Основи","l":"junior","q":"Який тип у process.env.BASE_URL у Node-проєкті з @types/node?","c":"","o":["string | undefined","string","any","string | null"],"e":"Змінної оточення може не бути, тому тип string | undefined. Варіанти: дефолт через ??, перевірка з помилкою на старті, або ! якщо впевнений. Останнє лише ховає проблему від компілятора."},{"t":"Основи","l":"junior","q":"Що робить оператор ! після виразу: page.locator(...)! або process.env.USER!?","c":"","o":["Прибирає null і undefined з типу без жодної перевірки в рантаймі","Кидає помилку, якщо значення null","Перетворює значення на boolean","Робить значення readonly"],"e":"Non-null assertion лише каже компілятору «повір мені». Якщо значення все ж undefined, помилка вилізе пізніше і в незрозумілому місці."},{"t":"Об'єктні типи","l":"junior","q":"Яку можливість має interface, але не має type alias?","c":"","o":["Declaration merging: два оголошення з однією назвою зливаються","Опис об'єктів","Наслідування","Generic-параметри"],"e":"Інтерфейси з однаковою назвою зливаються, так розширюють типи бібліотек. type не можна оголосити двічі, зате він описує union, кортежі, mapped і conditional types."},{"t":"Об'єктні типи","l":"middle","q":"Який рядок дасть помилку компіляції?","c":"type User = { name: string };\nconst extra = rd<Status, number>;","o":["Об'єкт рівно з ключами active і blocked, обидва number і обидва обов'язкові","Об'єкт з будь-якими ключами","Масив чисел довжиною 2","Map, де ключі необов'язкові"],"e":"Record з union ключів вимагає всі ключі. Додаси новий статус, і компілятор покаже всі об'єкти, де його бракує."},{"t":"Класи","l":"middle","q":"Чим private відрізняється від #field?","c":"","o":["private перевіряється тільки компілятором, #field приватне й у рантаймі","Нічим","#field працює тільки в TypeScript","private недоступне навіть у самому класі"],"e":"private зникає після компіляції, і (obj as any).secret спрацює. #field це нативна приватність JavaScript, ззовні до нього не дістатися."},{"t":"Класи","l":"middle","q":"Що робить цей конструктор?","c":"class LoginPage {\n  constructor(private readonly page: Page) {}\n}","o":["Оголошує поле this.page і присвоює йому аргумент: parameter property","Лише приймає аргумент, поля немає","Створює статичне поле","Це синтаксична помилка"],"e":"Модифікатор у параметрі конструктора (private, public, protected, readonly) автоматично створює й ініціалізує поле. Стандарт для Page Object."},{"t":"Класи","l":"middle","q":"Що можна зробити з abstract class BasePage?","c":"","o":["Успадкувати його, але не створити екземпляр через new","Створити екземпляр через new","Тільки імплементувати як interface","Нічого, abstract заборонено в TS"],"e":"Абстрактний клас може мати реалізовані методи і абстрактні, які зобов'язаний реалізувати нащадок. На відміну від interface, він існує в рантаймі."},{"t":"Класи","l":"senior","q":"Що виведе код?","c":"class Counter {\n  count = 0;\n  inc() { this.count++; }\n}\nconst c = new Counter();\nconst fn = c.inc;\nfn();","o":["TypeError: this undefined (у strict-режимі модуля)","count стане 1","Помилка компіляції","Нічого, count стане NaN"],"e":"Метод, відірваний від об'єкта, втрачає this. Рішення: стрілкова функція як поле класу inc = () => {...} або c.inc.bind(c). TypeScript цю помилку за замовчуванням не ловить."},{"t":"Асинхронність","l":"middle","q":"Що виведе код?","c":"console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);","o":["1 4 3 2","1 2 3 4","1 4 2 3","1 3 4 2"],"e":"Спочатку синхронний код (1, 4), потім черга мікрозадач (then: 3), потім макрозадачі (setTimeout: 2)."},{"t":"Асинхронність","l":"middle","q":"Чим Promise.all відрізняється від Promise.allSettled?","c":"","o":["all відхиляється на першій помилці, allSettled чекає всі й повертає статус кожного","allSettled виконує проміси послідовно","all працює тільки з двома промісами","Нічим"],"e":"all для «потрібні всі результати». allSettled для «зібрати все, навіть якщо щось впало», наприклад cleanup кількох сутностей."},{"t":"Асинхронність","l":"middle","q":"Що не так?","c":"async function cleanup(ids: number[]) {\n  ids.forEach(async id => {\n    await api.delete(id);\n  });\n  console.log('done');\n}","o":["forEach не чекає async-колбеки: done виведеться до видалень, помилки загубляться","Нічого, forEach підтримує async","Не можна писати async у стрілці","api.delete викличеться двічі"],"e":"forEach ігнорує проміси. Послідовно: for (const id of ids) await api.delete(id). Паралельно: await Promise.all(ids.map(id => api.delete(id)))."},{"t":"Асинхронність","l":"senior","q":"Чому дорівнює r?","c":"async function f() {\n  try {\n    return Promise.reject(new Error('x'));\n  } catch {\n    return 'caught';\n  }\n}\nconst r = await f().catch(() => 'outer');","o":["\"outer\"","\"caught\"","Error: x","undefined"],"e":"return без await віддає проміс назовні, і try/catch його не бачить. З return await помилка потрапила б у catch, і r було б \"caught\"."},{"t":"Асинхронність","l":"senior","q":"Чому 0.1 + 0.2 === 0.3 дає false і що робити з грошима в тестах?","c":"","o":["Числа у JS це IEEE 754 double; гроші рахують у мінорних одиницях як цілі числа або через decimal-бібліотеку","Це баг TypeScript, виправлений у strict-режимі","Треба використовувати тип money","Порівняння через == вирішує проблему"],"e":"0.1 + 0.2 дає 0.30000000000000004. Для сум: копійки як integer, BigInt або decimal.js. В асертах для float є toBeCloseTo."},{"t":"Просунуті типи","l":"senior","q":"Чому дорівнює R?","c":"type IsStr<X> = X extends string ? 'y' : 'n';\ntype R = IsStr<string | number>;","o":["\"y\" | \"n\"","\"n\"","\"y\"","never"],"e":"Conditional type на «голому» параметрі дистрибутивний: застосовується до кожного члена union окремо. Щоб вимкнути: [X] extends [string]."},{"t":"Просунуті типи","l":"senior","q":"Що робить mapped type?","c":"type Mutable<T> = { -readonly [K in keyof T]-?: T[K] };","o":["Прибирає readonly і робить усі поля обов'язковими","Робить усі поля readonly і необов'язковими","Видаляє всі поля","Копіює тип без змін"],"e":"Модифікатор - прибирає readonly чи ?, + додає. Так влаштовані Required і Readonly у стандартній бібліотеці."},{"t":"Просунуті типи","l":"senior","q":"Чому дорівнює E?","c":"type ElementOf<T> = T extends (infer U)[] ? U : never;\ntype E = ElementOf<string[]>;","o":["string","string[]","never","unknown"],"e":"infer оголошує змінну типу всередині extends і «витягує» частину типу. Так реалізовані ReturnType і Parameters."},{"t":"Просунуті типи","l":"senior","q":"Чому дорівнює E?","c":"type E = `on${Capitalize<'click' | 'hover'>}`;","o":["\"onClick\" | \"onHover\"","\"onclick\" | \"onhover\"","string","\"onClick\""],"e":"Template literal types розподіляються по union. Capitalize, Uppercase, Lowercase це вбудовані перетворення рядкових літералів."},{"t":"Просунуті типи","l":"senior","q":"Що з цього правда при strictFunctionTypes?","c":"type Handler<T> = (x: T) => void;\ndeclare let onAnimal: Handler<Animal>;\ndeclare let onDog: Handler<Dog>; // Dog extends Animal","o":["onDog = onAnimal дозволено, onAnimal = onDog помилка","onAnimal = onDog дозволено, onDog = onAnimal помилка","Обидва дозволено","Обидва помилка"],"e":"Параметри функцій контраваріантні. Обробник будь-якої тварини впорається з собакою, а обробник собаки не впорається з котом."},{"t":"Просунуті типи","l":"middle","q":"Яка опція НЕ вмикається прапорцем strict: true?","c":"","o":["noUncheckedIndexedAccess","strictNullChecks","noImplicitAny","strictFunctionTypes"],"e":"strict вмикає сімейство strict-перевірок, але noUncheckedIndexedAccess треба вмикати окремо. Вона додає | undefined до arr[i] і obj[key]."},{"t":"Просунуті типи","l":"middle","q":"Навіщо import type { Page } from '@playwright/test'?","c":"","o":["Імпорт гарантовано зникає після компіляції, бо використовується лише як тип","Імпортує тип швидше в рантаймі","Інакше Page неможливо імпортувати","Робить тип readonly"],"e":"Знімає неоднозначність для компілятора й бандлерів і запобігає побічним ефектам і циклічним залежностям. З verbatimModuleSyntax це обов'язково."},{"t":"Просунуті типи","l":"senior","q":"Що таке перевантаження функції в TypeScript?","c":"function parse(v: string): number;\nfunction parse(v: number): string;\nfunction parse(v: string | number) { /* ... */ }","o":["Кілька сигнатур для викликів і одна реалізація, яка зовні не видима","Кілька незалежних реалізацій, як у Java","Помилка: функцію не можна оголосити двічі","Generic-функція"],"e":"У рантаймі одна функція. Сигнатури лише описують, який тип повернення відповідає якому аргументу. Часто простіше замінити generic або union."}],"live":[{"id":1,"topic":"Локатори","lvl":"junior","min":5,"title":"Логін через user-facing локатори","task":"<p>Напиши тест: відкрити <code>/login<\/code>, ввести email і пароль, натиснути кнопку входу. Перевірити, що відкрилась сторінка <code>/dashboard<\/code> і видно заголовок «Dashboard».<\/p><ul><li>Тільки user-facing локатори.<\/li><li>Без жорстких пауз.<\/li><\/ul>","ctx":"<label for=\"email\">Email<\/label> <input id=\"email\">\n<label for=\"pwd\">Password<\/label> <input id=\"pwd\" type=\"password\">\n<button>Sign in<\/button>","starter":"import { test, expect } from '@playwright/test';\n\ntest('user can sign in', async ({ page }) => {\n  // твій код\n});","hints":["Поля мають label, тому getByLabel.","Кнопку шукай за роллю й іменем: getByRole('button', { name: ... }).","Для URL є web-first матчер toHaveURL, він ретраїться."],"checks":[["getByLabel для полів","getByLabel\\(",""],["getByRole для кнопки","getByRole\\(\\s*['\"]button['\"]",""],["fill для вводу","\\.fill\\(",""],["await expect(page).toHaveURL","await\\s+expect\\(\\s*page\\s*\\)\\.toHaveURL",""],["перевірка заголовка через getByRole heading","getByRole\\(\\s*['\"]heading['\"]",""],["без waitForTimeout","^(?![\\s\\S]*waitForTimeout)",""]],"sol":"import { test, expect } from '@playwright/test';\n\ntest('user can sign in', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Email').fill('qa@bank.test');\n  await page.getByLabel('Password').fill('S3cret!');\n  await page.getByRole('button', { name: 'Sign in' }).click();\n\n  await expect(page).toHaveURL(/\\/dashboard/);\n  await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();\n});","say":"Беру user-facing локатори, бо вони стійкі до змін верстки і заодно перевіряють доступність. Після кліку не чекаю вручну: toHaveURL і toBeVisible ретраяться до таймауту expect. URL перевіряю регуляркою, щоб не залежати від baseURL і query."},{"id":2,"topic":"Локатори","lvl":"middle","min":6,"title":"Кнопка в потрібному рядку таблиці","task":"<p>У таблиці транзакцій кілька рядків, у кожному кнопка «Details». Натисни «Details» саме в рядку з мерчантом <b>Netflix<\/b> і перевір, що відкрилась модалка з сумою <code>-49.99 PLN<\/code>.<\/p>","ctx":"<table> ... <tr><td>Netflix<\/td><td>-49.99 PLN<\/td><td><button>Details<\/button><\/td><\/tr> ...\nМодалка: <div role=\"dialog\"> ... <\/div>","starter":"test('open transaction details for Netflix', async ({ page }) => {\n  await page.goto('/transactions');\n  // твій код\n});","hints":["Почни з усіх рядків: getByRole('row').","Звузь через .filter({ hasText: ... }).","Модалка має роль dialog."],"checks":[["рядки через getByRole row","getByRole\\(\\s*['\"]row['\"]",""],["filter з hasText","\\.filter\\(\\s*\\{\\s*hasText",""],["кнопка шукається всередині рядка (ланцюжок)","filter\\([^)]*\\)\\s*\\)?\\s*\\.getByRole\\(\\s*['\"]button['\"]|row[\\w]*\\.getByRole\\(\\s*['\"]button['\"]",""],["dialog за роллю","getByRole\\(\\s*['\"]dialog['\"]",""],["toContainText або toHaveText","toContainText|toHaveText",""],["без nth() як основного способу","^(?![\\s\\S]*\\.nth\\()",""]],"sol":"test('open transaction details for Netflix', async ({ page }) => {\n  await page.goto('/transactions');\n\n  const row = page.getByRole('row').filter({ hasText: 'Netflix' });\n  await row.getByRole('button', { name: 'Details' }).click();\n\n  const dialog = page.getByRole('dialog');\n  await expect(dialog).toBeVisible();\n  await expect(dialog).toContainText('-49.99 PLN');\n});","say":"Не беру nth, бо порядок рядків змінюється від сортування й нових даних. Фільтрую рядок за текстом і шукаю кнопку всередині нього, тобто ланцюжок локаторів задає контекст. Перевірки роблю в межах dialog, щоб не зачепити такий самий текст у таблиці."},{"id":3,"topic":"Асерти","lvl":"junior","min":5,"title":"Кількість і тексти елементів списку","task":"<p>У кошику мають бути рівно три товари в такому порядку: <code>Keyboard<\/code>, <code>Mouse<\/code>, <code>Monitor<\/code>. Перевір обидва факти одним-двома асертами.<\/p>","ctx":"<ul data-testid=\"cart\"><li class=\"item\">Keyboard<\/li> ... <\/ul>","starter":"test('cart contains expected items', async ({ page }) => {\n  await page.goto('/cart');\n  // твій код\n});","hints":["Для кількості є toHaveCount.","toHaveText приймає масив і перевіряє порядок.","Не роби allTextContents() + toEqual: це не web-first."],"checks":[["getByTestId cart","getByTestId\\(\\s*['\"]cart['\"]",""],["toHaveCount(3)","toHaveCount\\(\\s*3\\s*\\)",""],["toHaveText з масивом","toHaveText\\(\\s*\\[",""],["без allTextContents","^(?![\\s\\S]*allTextContents)",""]],"sol":"test('cart contains expected items', async ({ page }) => {\n  await page.goto('/cart');\n  const items = page.getByTestId('cart').getByRole('listitem');\n\n  await expect(items).toHaveCount(3);\n  await expect(items).toHaveText(['Keyboard', 'Mouse', 'Monitor']);\n});","say":"toHaveText з масивом перевіряє і кількість, і порядок, і ретраїться, поки список дорендерюється. allTextContents знімає знімок один раз, і на повільному рендері тест стане flaky."},{"id":4,"topic":"Асерти","lvl":"junior","min":5,"title":"Негативний кейс валідації форми","task":"<p>Відправ форму реєстрації з порожнім email. Перевір, що з'явилась помилка «Email is required», поле має <code>aria-invalid=\"true\"<\/code>, а URL не змінився.<\/p>","ctx":"<input aria-label=\"Email\" aria-invalid=\"true\">\n<span role=\"alert\">Email is required<\/span>\n<button>Create account<\/button>","starter":"test('shows error for empty email', async ({ page }) => {\n  await page.goto('/register');\n  // твій код\n});","hints":["Помилка має role=\"alert\".","Атрибут: toHaveAttribute.","URL: toHaveURL з тим самим шляхом."],"checks":[["клік по кнопці","\\.click\\(",""],["getByRole alert","getByRole\\(\\s*['\"]alert['\"]",""],["toHaveAttribute aria-invalid","toHaveAttribute\\(\\s*['\"]aria-invalid['\"]",""],["toHaveURL","toHaveURL",""]],"sol":"test('shows error for empty email', async ({ page }) => {\n  await page.goto('/register');\n  await page.getByRole('button', { name: 'Create account' }).click();\n\n  await expect(page.getByRole('alert')).toHaveText('Email is required');\n  await expect(page.getByLabel('Email')).toHaveAttribute('aria-invalid', 'true');\n  await expect(page).toHaveURL(/\\/register$/);\n});","say":"Негативний тест перевіряє три речі: повідомлення, стан поля і те, що переходу не було. Остання перевірка ловить баг, коли форма показує помилку, але все одно відправляється."},{"id":5,"topic":"Bug hunt","lvl":"middle","min":6,"title":"Знайди, чому тест flaky","task":"<p>Тест падає приблизно в одному запуску з десяти. Знайди всі проблеми й переп
