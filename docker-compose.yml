# Alternative to the embedded dev database: `docker compose up -d db`.
# Uses the same port and credentials as `npm run db:start`, so DATABASE_URL stays the same.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qahub
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d qahub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
